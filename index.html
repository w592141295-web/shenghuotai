<style>

<script id="app-script">
"use strict";
const P="wb_life_";let IDB=null,IDBOK=false;
function idbOpen(){return new Promise(res=>{if(IDBOK)return res(IDB);if(!window.indexedDB)return res(null);const rq=indexedDB.open("wb_life_db",1);rq.onupgradeneeded=()=>{const db=rq.result;if(!db.objectStoreNames.contains("kv"))db.createObjectStore("kv")};rq.onsuccess=()=>{IDB=rq.result;IDBOK=true;res(IDB)};rq.onerror=()=>res(null)})}
function idbPut(k,v){return idbOpen().then(db=>{if(!db)return;return new Promise(res=>{const tx=db.transaction("kv","readwrite");tx.objectStore("kv").put(v,k);tx.oncomplete=res;tx.onerror=res})})}
function idbDel(k){return idbOpen().then(db=>{if(!db)return;return new Promise(res=>{const tx=db.transaction("kv","readwrite");tx.objectStore("kv").delete(k);tx.oncomplete=res;tx.onerror=res})})}
function idbAll(){return idbOpen().then(db=>{if(!db)return[];return new Promise(res=>{const tx=db.transaction("kv","readonly");const rq=tx.objectStore("kv").getAll();rq.onsuccess=()=>res(rq.result||[]);rq.onerror=()=>res([])})})}
function idbKeys(){return idbOpen().then(db=>{if(!db)return[];return new Promise(res=>{const tx=db.transaction("kv","readonly");const rq=tx.objectStore("kv").getAllKeys();rq.onsuccess=()=>res(rq.result||[]);rq.onerror=()=>res([])})})}
function idbRestore(){return new Promise(res=>{idbKeys().then(keys=>idbAll().then(all=>{for(let i=0;i<keys.length;i++){const k=keys[i];if(!localStorage.getItem(P+k)){try{localStorage.setItem(P+k,all[i])}catch(e){}}}for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.indexOf(P)===0)idbPut(k.slice(P.length),localStorage.getItem(k))}res()}))})}
const LS={get(k,f){try{const v=localStorage.getItem(P+k);return v?JSON.parse(v):(f!==undefined?f:null)}catch(e){console.error("LS read:",k,e);showToast("数据读取异常");return f!==undefined?f:null}},raw(k){try{return localStorage.getItem(P+k)}catch(e){return null}},set(k,v){try{localStorage.setItem(P+k,JSON.stringify(v));idbPut(k,JSON.stringify(v));return true}catch(e){if(e.name==="QuotaExceededError")showToast("存储空间不足，请导出备份后清理");else showToast("存储失败");return false}},del(k){try{localStorage.removeItem(P+k);idbDel(k)}catch(e){}}};
const S={tab:"home",jDate:new Date(),jCalView:"month",jCalDate:new Date(),jMood:"",jColor:null,jImgs:[],jSearch:"",jTag:"",fFilter:"all",fSearch:"",fMonth:new Date(),hDate:new Date(),mView:"grid",mFilter:"all",mSearch:"",mTag:"",dFilter:"all",ed:{}};
function fd(d){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),da=String(d.getDate()).padStart(2,"0");return`${y}-${m}-${da}`}
function fdcn(d){const w=["日","一","二","三","四","五","六"];return`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 星期${w[d.getDay()]}`}
function fm(d){return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`}
function fmcn(d){return`${d.getFullYear()}年${d.getMonth()+1}月`}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function today(){return fd(new Date())}
function eh(s){return(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function parseTags(s){return (s||"").split(/[\s,，]+/).map(t=>t.replace(/^#/,"").trim()).filter(Boolean).filter((v,i,a)=>a.indexOf(v)===i)}
function tagHTML(tags,fn){fn=fn||"jTagFilter";return (tags||[]).map(t=>`<span class="tag tb-tag" style="cursor:pointer" onclick="${fn}('${t.replace(/'/g,"\\'")}')">#${t}</span>`).join("")}
function jEntryHTML(e){return `<div class="je" style="${e.color?"background:"+e.color+"20":""}"><div class="jm"><span class="jt">${e.mood||""} ${e.date.slice(5)}</span><div class="ja"><button class="btn bo bs" style="padding:2px 6px;font-size:11px" onclick="jEdit('${e.id}')">编辑</button><button class="btn bo bs" style="padding:2px 6px;font-size:11px;color:var(--red)" onclick="jDel('${e.id}')">删除</button></div></div>${e.tags&&e.tags.length?`<div class="ji">${tagHTML(e.tags)}</div>`:""}<div class="jx">${eh(e.content)||'<span class="t3">（图片记录）</span>'}</div>${e.images&&e.images.length?`<div class="ji">${e.images.map(img=>`<img src="${img}" onclick="openModal('<img src=&quot;${img}&quot; style=&quot;width:100%;border-radius:8px&quot;>')">`).join("")}</div>`:""}</div>`}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2000)}
function compressImg(file,mw){return new Promise(r=>{const rd=new FileReader();rd.onload=e=>{const im=new Image();im.onload=()=>{const sc=Math.min(1,mw/Math.max(im.width,im.height));const c=document.createElement("canvas");c.width=im.width*sc;c.height=im.height*sc;const cx=c.getContext("2d");cx.drawImage(im,0,0,c.width,c.height);r(c.toDataURL("image/jpeg",0.68))};im.onerror=()=>r(null);im.src=e.target.result};rd.onerror=()=>r(null);rd.readAsDataURL(file)})}
function pickImg(cb){const inp=document.getElementById("fi");inp.multiple=false;inp.onchange=async e=>{const f=e.target.files[0];if(f){const d=await compressImg(f,800);if(d)cb(d)}e.target.value=""};inp.click()}
function pickImgs(cb){const inp=document.getElementById("fi");inp.multiple=true;inp.onchange=async e=>{for(const f of e.target.files){const d=await compressImg(f,800);if(d)cb(d)}e.target.value=""};inp.click()}
const IC={home:'<svg class="ic" viewBox="0 0 24 24"><path d="M3 12l9-9 9 9M5 10v10h14V10"/></svg>',journal:'<svg class="ic" viewBox="0 0 24 24"><path d="M4 4h16v16H4zM4 9h16M9 4v16"/></svg>',finance:'<svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 10h4a1.5 1.5 0 010 3h-3a1.5 1.5 0 000 3h4"/></svg>',habits:'<svg class="ic" viewBox="0 0 24 24"><path d="M9 11l3 3L22 4M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>',fitness:'<svg class="ic" viewBox="0 0 24 24"><path d="M6 4v16M18 4v16M2 8v8M22 8v8M6 12h12"/></svg>',schedule:'<svg class="ic" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 10h18M8 2v4M16 2v4"/></svg>',shopping:'<svg class="ic" viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 002 1.6h9.7a2 2 0 002-1.6L23 6H6"/></svg>',media:'<svg class="ic" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M7 4v16M17 4v16M2 9h5M2 15h5M17 9h5M17 15h5"/></svg>',decor:'<svg class="ic" viewBox="0 0 24 24"><path d="M3 12l9-9 9 9M5 10v10h14V10M9 20v-6h6v6"/></svg>',settings:'<svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 008 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.6 15a1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.6a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>'};
const NAV=[{k:"home",l:"首页",i:IC.home},{k:"journal",l:"每日记录",i:IC.journal},{k:"finance",l:"记账理财",i:IC.finance},{k:"habits",l:"习惯健康",i:IC.habits},{k:"fitness",l:"减脂健身",i:IC.fitness},{k:"schedule",l:"日程统筹",i:IC.schedule},{k:"shopping",l:"待买清单",i:IC.shopping},{k:"media",l:"书影音",i:IC.media},{k:"decor",l:"装修灵感",i:IC.decor},{k:"settings",l:"设置",i:IC.settings}];
const MNAV=["home","journal","finance","habits","more"];
const TMAP={home:"首页",journal:"每日记录",finance:"记账理财",habits:"习惯健康",fitness:"减脂健身",schedule:"日程统筹",shopping:"待买清单",media:"书影音收藏",decor:"装修灵感墙",settings:"设置与备份"};

function initNav(){let h="";NAV.forEach(n=>{h+=`<button class="nl ${n.k==="home"?"active":""}" data-t="${n.k}" onclick="switchTab('${n.k}')">${n.i}<span>${n.l}</span></button>`});document.getElementById("snav").innerHTML=h;let bh="";MNAV.forEach(k=>{if(k==="more"){bh+=`<button class="bi" onclick="openMM()">${IC.home}<span>更多</span></button>`}else{const n=NAV.find(x=>x.k===k);bh+=`<button class="bi ${k==="home"?"active":""}" data-t="${k}" onclick="switchTab('${k}')">${n.i}<span>${n.l}</span></button>`}});document.getElementById("bn").innerHTML=bh;const mg=document.getElementById("mgrid");const mi=NAV.filter(n=>!MNAV.includes(n.k));mg.innerHTML=mi.map(n=>`<button onclick="switchTab('${n.k}');closeMM()">${n.i}<span>${n.l}</span></button>`).join("");document.getElementById("mtg").onclick=()=>{document.getElementById("sidebar").classList.toggle("show");document.getElementById("ov").classList.toggle("show")};document.getElementById("mmr").onclick=openMM;document.getElementById("ov").onclick=()=>{document.getElementById("sidebar").classList.remove("show");document.getElementById("ov").classList.remove("show")}}
function switchTab(t){S.tab=t;document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));const pg=document.getElementById("page-"+t);if(pg)pg.classList.add("active");document.querySelectorAll(".nl").forEach(n=>n.classList.toggle("active",n.dataset.t===t));document.querySelectorAll(".bi").forEach(n=>n.classList.toggle("active",n.dataset.t===t));document.getElementById("mht").textContent=TMAP[t]||"";document.getElementById("sidebar").classList.remove("show");document.getElementById("ov").classList.remove("show");closeMM();renderTab(t);document.getElementById("main").scrollTop=0}
function renderTab(t){({home:renderHome,journal:renderJournal,finance:renderFinance,habits:renderHabits,fitness:renderFitness,schedule:renderSchedule,shopping:renderShopping,media:renderMedia,decor:renderDecor,settings:renderSettings}[t]||(()=>{}))()}
function openMM(){document.getElementById("mm").classList.add("show")}
function closeMM(){document.getElementById("mm").classList.remove("show")}

function openModal(h){document.getElementById("mcontent").innerHTML=h;document.getElementById("modal").classList.add("show")}

document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
function totalRecords(){let n=0;["journal","finance","habits","habit_logs","fitness","todos","shopping","media","decor"].forEach(k=>{const d=LS.get(k,[]);if(Array.isArray(d))n+=d.length});return n}
function checkBB(){const n=totalRecords();const dis=LS.get("bb_dismissed",false);const snz=LS.get("bb_snoozed",0);const bar=document.getElementById("bb");if(n>=20&&!dis&&Date.now()-snz>7*86400000){const cnt=LS.get("bb_cancel_cnt",0)||0;const lb=LS.get("lastBackup",0);const fr=LS.get("bb_first_remind",0);const base=lb||fr;const days=base?Math.max(1,Math.floor((Date.now()-base)/86400000)):0;const t=bar&&bar.querySelector?bar.querySelector(".bb-t"):null;if(t){if(cnt>=2&&days>0){t.innerHTML=`⚠️ 你已连续 <b>${cnt}</b> 次取消备份，已 <b>${days}</b> 天未备份，请尽快导出备份 →`}else if(cnt>=2){t.innerHTML=`⚠️ 你已连续 ${cnt} 次取消备份，请尽快导出备份 →`}else{t.innerHTML="数据已积累20+条，建议导出备份 →"}}bar.classList.add("show")}else{bar.classList.remove("show")}}

/* HOME */
function renderHome(){const now=new Date(),ts=fd(now),h=now.getHours();let g="晚上好";if(h<6)g="凌晨好";else if(h<12)g="早上好";else if(h<14)g="中午好";else if(h<18)g="下午好";const habits=LS.get("habits",[]),hlogs=LS.get("habit_logs",[]),tlogs=hlogs.filter(l=>l.date===ts);const hs=habits.length>0?Math.round(tlogs.filter(l=>l.done).length/habits.length*30):15;const journal=LS.get("journal",[]),tje=journal.find(j=>j.date===ts);const ms=tje?20:0;const todos=LS.get("todos",[]),tt=todos.filter(t=>t.date===ts),dt=tt.filter(t=>t.done).length;const ts2=tt.length>0?Math.round(dt/tt.length*15):8;const js2=tje?15:0;const fit=LS.get("fitness",[]),fs=fit.length>0?12:5;const li=Math.min(100,hs+ms+ts2+js2+fs+10);const fm2=fm(now),fin=LS.get("finance",[]),mexp=fin.filter(f=>f.type==="expense"&&f.date.startsWith(fm2)).reduce((s,f)=>s+f.amount,0);const shop=LS.get("shopping",[]),ub=shop.filter(s=>!s.bought).length;const od=todos.filter(t=>!t.done&&t.date<ts);const me=tje?.mood||"";let html=`<div class="dhero"><div class="f13" style="opacity:.9">${fdcn(now)}</div><div class="dg">${g}${me?" "+me:""}</div><div class="di"><span class="n">${li}</span><span class="f13" style="opacity:.85">生活指数 / 100</span></div><div class="dhs"><span>习惯 ${tlogs.filter(l=>l.done).length}/${habits.length}</span><span>待办 ${dt}/${tt.length}</span><span>今日支出 ¥${mexp.toFixed(0)}</span></div></div><div class="sg"><div class="sm"><div class="v" style="color:var(--accent)">¥${mexp.toFixed(0)}</div><div class="l">本月支出</div></div><div class="sm"><div class="v" style="color:var(--green)">${habits.filter(h=>tlogs.some(l=>l.habitId===h.id&&l.done)).length}</div><div class="l">今日打卡</div></div><div class="sm"><div class="v" style="color:var(--gold)">${ub}</div><div class="l">待买物品</div></div><div class="sm"><div class="v" style="color:var(--blue)">${od.length}</div><div class="l">逾期待办</div></div></div><div class="card mt16"><h3 class="f14 fw7 mb8">今天要处理</h3>`;const items=[];od.forEach(t=>items.push({d:"var(--accent)",t:t.title,tg:"逾期",tc:"tr-tag"}));tt.filter(t=>!t.done).forEach(t=>items.push({d:"var(--gold)",t:t.title,tg:"今天",tc:"tgold"}));shop.filter(s=>!s.bought&&s.priority==="high").forEach(s=>items.push({d:"var(--green)",t:s.name,tg:"待买",tc:"tg-tag"}));if(items.length===0){html+=`<div class="empty">暂无待处理事项，享受生活</div>`}else{items.slice(0,8).forEach(i=>{html+=`<div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border)"><span style="width:8px;height:8px;border-radius:50%;background:${i.d};flex-shrink:0"></span><span class="f13" style="flex:1">${eh(i.t)}</span><span class="tag ${i.tc}">${i.tg}</span></div>`})}html+=`</div><div class="card mt16"><h3 class="f14 fw7 mb8">快捷入口</h3><div class="g4"><button class="btn bo bs" onclick="switchTab('journal')">写日记</button><button class="btn bo bs" onclick="switchTab('finance')">记一笔</button><button class="btn bo bs" onclick="switchTab('habits')">打卡</button><button class="btn bo bs" onclick="switchTab('fitness')">记体重</button></div></div>`;document.getElementById("page-home").innerHTML=html;checkBB()}

function renderJournal(){const ts=fd(S.jDate);const all=LS.get("journal",[]);const allTags=[...new Set(all.flatMap(e=>e.tags||[]))].sort();const tagChips=allTags.map(t=>`<button class="chip ${S.jTag===t?"active":""}" onclick="jTagFilter('${t.replace(/'/g,"\\'")}')">#${t}</button>`).join("");const activeFilter=(S.jSearch?`<button class="chip active" onclick="jSearch('')">🔍 ${S.jSearch} ×</button>`:"")+(S.jTag?`<button class="chip active" onclick="jTagFilter('')">#${S.jTag} ×</button>`:"");let html=`<div class="ph"><div><div class="pt">每日记录</div><div class="ps">${fdcn(S.jDate)}</div></div><div class="row"><button class="btn bo bs" onclick="jCD(-1)">‹</button><input type="date" value="${ts}" onchange="jSD(this.value)" style="width:auto"><button class="btn bo bs" onclick="jCD(1)">›</button><button class="btn bp bs" onclick="importRiji()">📥 导入日迹</button></div></div><div class="card mb16"><div class="ig"><label>心情</label><div class="mood-row" id="moodRow">${MOODS.map(m=>`<button class="mb2 ${S.jMood===m?"sel":""}" onclick="jSM('${m}')">${m}</button>`).join("")}</div></div><div class="ig"><label>标记色</label><div class="row" id="colorRow"><span class="cdot none ${!S.jColor?"sel":""}" onclick="jSC(null,event)">×</span>${CCOL.map(c=>`<span class="cdot ${S.jColor===c?"sel":""}" style="background:${c}" onclick="jSC('${c}',event)"></span>`).join("")}</div></div><div class="ig"><label>记录</label><textarea id="jText" placeholder="今天发生了什么..." style="min-height:60px"></textarea></div><div class="ig"><label>标签</label><input type="text" id="jTagsIn" placeholder="用空格或逗号分隔，如：咖啡 阅读"></div><div id="jImgs" class="row" style="flex-wrap:wrap;margin-bottom:8px;gap:4px"></div><div class="row"><button class="btn bo bs" onclick="jAP()">+ 照片</button><button class="btn bp gw" onclick="jSave()">保存</button></div></div><div class="jbar"><div class="ctabs"><button class="chip ${S.jCalView==="month"?"active":""}" onclick="jSCal('month')">月历</button><button class="chip ${S.jCalView==="list"?"active":""}" onclick="jSCal('list')">列表</button><button class="chip ${S.jCalView==="year"?"active":""}" onclick="jSCal('year')">年历</button></div><div class="jsw"><input type="text" id="jSearchIn" value="${eh(S.jSearch)}" placeholder="搜索..." oninput="jSearch(this.value)"></div></div><div class="jfilter"><div class="chips" id="jTagChips">${activeFilter}${tagChips}</div></div><div id="jCal"></div>`;document.getElementById("page-journal").innerHTML=html;renderJImgs();renderJCal()}

function jSave(){const txt=document.getElementById("jText").value.trim();if(!txt&&S.jImgs.length===0){toast("写点什么或加张图");return}const tags=parseTags(document.getElementById("jTagsIn").value);const entries=LS.get("journal",[]);entries.push({id:uid(),date:fd(S.jDate),content:txt,mood:S.jMood||"",color:S.jColor||null,images:[...S.jImgs],tags,createdAt:Date.now()});LS.set("journal",entries);document.getElementById("jText").value="";document.getElementById("jTagsIn").value="";S.jMood="";S.jColor=null;S.jImgs=[];renderJournal();toast("已保存");checkBB()}
function jDel(id){if(!confirm("删除这条记录？"))return;let e=LS.get("journal",[]);e=e.filter(x=>x.id!==id);LS.set("journal",e);renderJournal();toast("已删除")}

function jEdit(id){const entries=LS.get("journal",[]);const e=entries.find(x=>x.id===id);if(!e)return;S.ed.je={...e,images:[...(e.images||[])]};openModal(`<div class="mtitle">编辑记录</div><div class="ig"><label>日期</label><input type="date" id="jeDate" value="${e.date}"></div><div class="ig"><label>心情</label><div class="mood-row" id="jeMoodRow">${MOODS.map(m=>`<button class="mb2 ${e.mood===m?"sel":""}" onclick="jESM('${m}')">${m}</button>`).join("")}</div></div><div class="ig"><label>标记色</label><div class="row" id="jeColorRow"><span class="cdot none ${!e.color?"sel":""}" onclick="jESC(null,event)">×</span>${CCOL.map(c=>`<span class="cdot ${e.color===c?"sel":""}" style="background:${c}" onclick="jESC('${c}',event)"></span>`).join("")}</div></div><div class="ig"><label>记录</label><textarea id="jeText" style="min-height:80px">${eh(e.content||"")}</textarea></div><div class="ig"><label>标签</label><input type="text" id="jeTags" value="${eh((e.tags||[]).join(" "))}" placeholder="用空格或逗号分隔"></div><div id="jeImgs" class="row" style="flex-wrap:wrap;margin-bottom:8px;gap:4px"></div><div class="row mb12"><button class="btn bo bs" onclick="jEAP()">+ 照片</button></div><div class="row" style="gap:12px"><button class="btn bo" style="color:var(--red)" onclick="closeModal();jDel('${e.id}')">删除</button><button class="btn bo gw" onclick="closeModal()">取消</button><button class="btn bp gw" onclick="jEditSave('${e.id}')">保存</button></div>`);renderJEImgs()}

function jEditSave(id){const entries=LS.get("journal",[]);const e=entries.find(x=>x.id===id);if(!e)return;e.date=document.getElementById("jeDate").value||e.date;e.content=document.getElementById("jeText").value.trim();e.mood=S.ed.je.mood||"";e.color=S.ed.je.color||null;e.tags=parseTags(document.getElementById("jeTags").value);e.images=[...(S.ed.je.images||[])];LS.set("journal",entries);closeModal();renderJournal();toast("已更新")}
function renderJCal(){const box=document.getElementById("jCal");if(!box)return;const all=LS.get("journal",[]);const q=(S.jSearch||"").trim().toLowerCase();const hasFilter=q||S.jTag;const matches=e=>{const okQ=!q||((e.content||"").toLowerCase().includes(q));const okT=!S.jTag||(e.tags||[]).includes(S.jTag);return okQ&&okT};if(S.jCalView==="month"){const d=new Date(S.jCalDate);d.setDate(1);const off=(d.getDay()+6)%7;const dim=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();const pdim=new Date(d.getFullYear(),d.getMonth(),0).getDate();const td=today();let h=`<div class="row" style="justify-content:space-between;margin-bottom:10px"><button class="btn bo bs" onclick="jCC(-1)">‹</button><span class="fw7">${fmcn(d)}</span><button class="btn bo bs" onclick="jCC(1)">›</button></div><div class="mg-cal">`;["一","二","三","四","五","六","日"].forEach(w=>h+=`<div class="wd">${w}</div>`);for(let i=0;i<off;i++){const day=pdim-off+1+i;h+=`<div class="mday other"><div class="dn">${day}</div></div>`}for(let day=1;day<=dim;day++){const ds=fd(new Date(d.getFullYear(),d.getMonth(),day));const de=all.filter(e=>e.date===ds);const hp=de.some(e=>e.images&&e.images.length>0);const bg=hp?de.find(e=>e.images&&e.images.length>0).images[0]:null;const mood=de.find(e=>e.mood)?.mood||"";const isToday=ds===td;h+=`<div class="mday ${hp?"hp":""} ${isToday?"today":""}" onclick="jGTD('${ds}')">${bg?`<div class="dbg" style="background-image:url('${bg}')"></div>`:""}<div class="dn">${day}</div>${mood?`<div class="me">${mood}</div>`:""}</div>`}const tot=off+dim;const nx=Math.ceil(tot/7)*7-tot;for(let i=1;i<=nx;i++)h+=`<div class="mday other"><div class="dn">${i}</div></div>`;h+=`</div>`;let te,title;if(hasFilter){te=all.filter(matches).sort((a,b)=>b.date.localeCompare(a.date)||(b.createdAt||0)-(a.createdAt||0));title=`搜索结果（${te.length}条）`}else{te=all.filter(e=>e.date===fd(S.jDate)).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));title=fd(S.jDate)+" 的记录"}if(te.length>0){h+=`<h3 class="f14 fw7 mt16 mb8">${title}</h3>`+te.map(jEntryHTML).join("")}else if(hasFilter){h+=`<div class="empty" style="padding:20px 0">没有找到匹配记录</div>`}box.innerHTML=h}else if(S.jCalView==="list"){const sorted=[...all].filter(matches).sort((a,b)=>b.date.localeCompare(a.date)||(b.createdAt||0)-(a.createdAt||0));if(sorted.length===0){box.innerHTML='<div class="empty">还没有记录</div>';return}box.innerHTML=sorted.map(jEntryHTML).join("")}else if(S.jCalView==="year"){const yr=S.jCalDate.getFullYear();const tn=new Date();let h=`<div class="row" style="justify-content:space-between;margin-bottom:10px"><button class="btn bo bs" onclick="jYC(-1)">‹</button><span class="fw7">${yr}年</span><button class="btn bo bs" onclick="jYC(1)">›</button></div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">`;for(let m=0;m<12;m++){const dim=new Date(yr,m+1,0).getDate();const fd2=new Date(yr,m,1).getDay();const so=(fd2+6)%7;h+=`<div class="cs" style="padding:8px"><div class="f12 fw7 mb8">${m+1}月</div><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px">`;for(let i=0;i<so;i++)h+="<span></span>";for(let day=1;day<=dim;day++){const ds=fd(new Date(yr,m,day));const has=all.some(e=>e.date===ds);const isT=tn.getFullYear()===yr&&tn.getMonth()===m&&tn.getDate()===day;h+=`<span style="aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;${has?"background:var(--green);color:#fff":""}${isT?"background:var(--accent);color:#fff":""}" onclick="jGTD('${ds}')">${day}</span>`}h+=`</div></div>`}h+=`</div>`;box.innerHTML=h}}
function jCC(d){S.jCalDate.setMonth(S.jCalDate.getMonth()+d);S.jCalDate=new Date(S.jCalDate);renderJCal()}
function jYC(d){S.jCalDate.setFullYear(S.jCalDate.getFullYear()+d);S.jCalDate=new Date(S.jCalDate);renderJCal()}

/* RIJI IMPORT */
function importRiji(){openModal(`<div class="mtitle">从日迹导入日记</div><p class="f13 t2 mb12">把日迹App里的日记合并进「每日记录」。同一批记录只会导入一次，重复导入自动跳过。</p><div class="col" style="gap:10px"><button class="btn bp" onclick="closeModal();rijiPickFile()">① 选择日迹备份文件</button><p class="f11 t3">先在日迹「我的 → 导出数据」导出 JSON 备份，再在这里选择该文件。任何设备、任何打开方式都可用。</p><button class="btn bo" onclick="rijiReadDB()">② 直接读取本浏览器日迹</button><p class="f11 t3">需要日迹与本工作台在同一个网址下打开（例如都部署到 GitHub Pages 后）。本地文件方式打开时可能不可用。</p></div>`)}
function rijiPickFile(){const inp=document.getElementById("fj");inp.onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const text=await f.text();const data=JSON.parse(text);if(!data||typeof data!=="object"||!Array.isArray(data.diaries))throw new Error("不是日迹导出的备份文件（缺少 diaries 数据）");const r=rijiMerge(data.diaries);renderJournal();checkBB();toast(`导入完成：新增${r.added}条，跳过${r.skipped}条`)}catch(err){toast("导入失败");openModal(`<div class="mtitle">导入失败</div><p class="f13 t2 mb12">请确认选择的是日迹App「我的 → 导出数据」生成的 JSON 备份文件。</p><p class="f12 t2">错误信息：${eh(err.message)}</p><div class="row mt12"><button class="btn bp gw" onclick="closeModal()">知道了</button></div>`)}e.target.value=""};inp.click()}
function rijiReadDB(){let open;try{open=indexedDB.open("riji_v3",3)}catch(err){rijiDBFail();return}open.onerror=()=>rijiDBFail();open.onsuccess=()=>{const db=open.result;let tx;try{tx=db.transaction("diaries","readonly")}catch(err){db.close();rijiDBFail();return}const rq=tx.objectStore("diaries").getAll();rq.onsuccess=()=>{const list=rq.result||[];db.close();if(!list.length){toast("日迹里还没有日记数据");return}const r=rijiMerge(list);renderJournal();checkBB();toast(`导入完成：新增${r.added}条，跳过${r.skipped}条`)};rq.onerror=()=>{db.close();rijiDBFail()}}}
function rijiDBFail(){openModal(`<div class="mtitle">无法直接读取</div><p class="f13 t2 mb12">日迹的数据存放在它自己的浏览器存储里，只有和日迹在同一个网址下打开时才能直接读取（例如都部署在 GitHub Pages 之后）。</p><p class="f12 t2">推荐改用第一种方式：先在日迹「我的 → 导出数据」导出备份，再把 JSON 文件选进来。</p><div class="row mt12"><button class="btn bp gw" onclick="closeModal()">知道了</button></div>`)}
function rijiMerge(diaries){const entries=LS.get("journal",[]);const seen=new Set(entries.filter(e=>e.src&&e.src.indexOf("riji:")===0).map(e=>e.src));let added=0,skipped=0;diaries.forEach(d=>{if(!d||(!d.content&&(!d.images||!d.images.length)))return;const src="riji:"+(d.id!==undefined&&d.id!==null?d.id:(d.createdAt||"x"));if(seen.has(src)){skipped++;return}let date=d.dateStart||d.date||"";if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){skipped++;return}let content=d.content||"";const ex=[];if(d.dateStart&&d.dateEnd&&d.dateEnd!==d.dateStart)ex.push(`📅 ${d.dateStart} 至 ${d.dateEnd}`);if(d.startTime&&d.endTime)ex.push(`🕐 ${d.startTime}-${d.endTime}`);else if(d.startTime)ex.push(`🕐 ${d.startTime}`);else if(d.endTime)ex.push(`🕐 ${d.endTime}`);if(ex.length)content=(content?content+"\n":"")+ex.join("  ");entries.push({id:uid(),date,content,mood:"",color:d.color||null,images:d.images?d.images.slice():[],createdAt:d.createdAt||Date.now(),src});seen.add(src);added++});const ok=LS.set("journal",entries);if(!ok)toast("存储失败：导入的数据可能超出浏览器存储上限，建议先导出备份再清理");return{added,skipped}}
