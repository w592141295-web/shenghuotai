const FT=[{k:"expense",n:"支出",c:"#FF6B6B"},{k:"income",n:"收入",c:"#4ECDC4"},{k:"lend",n:"借出",c:"#FFB347"},{k:"borrow",n:"借入",c:"#A29BFE"},{k:"invest",n:"投资",c:"#6C9BCF"}];
function renderFinance(){const fms=fm(S.fMonth),all=LS.get("finance",[]),mt=all.filter(t=>t.date.startsWith(fms)).sort((a,b)=>b.date.localeCompare(a.date)||(b.createdAt||0)-(a.createdAt||0)),fq=(S.fSearch||"").trim(),ql=(S.fFilter==="all"?mt:mt.filter(t=>t.type===S.fFilter)).filter(t=>{if(!fq)return true;const cs=getCats()[t.type]||[];const c=cs.find(x=>x.k===t.category);const cn=c?c.n:t.category;const sn=t.sub?(c&&(c.subs||[]).find(x=>x.k===t.sub)||{n:t.sub}).n:"";return cn.indexOf(fq)>=0||sn.indexOf(fq)>=0||(t.note||"").indexOf(fq)>=0});const exp=mt.filter(t=>t.type==="expense").reduce((s,t)=>s+t.amount,0),inc=mt.filter(t=>t.type==="income").reduce((s,t)=>s+t.amount,0),net=inc-exp;const bud=LS.get("budget",{total:5000});const bpct=bud.total>0?Math.min(100,exp/bud.total*100):0;const bc=bpct>90?"var(--accent)":bpct>70?"var(--gold)":"var(--green)";const catsNow=getCats(),lvl=S.fLevel||"cat";const catT={};mt.filter(t=>t.type==="expense").forEach(t=>{const key=(lvl==="sub"&&t.sub)?t.category+"::"+t.sub:t.category;catT[key]=(catT[key]||0)+t.amount});const catD=Object.entries(catT).sort((a,b)=>b[1]-a[1]).map(([k,v])=>{const ks=k.split("::");let nm=k,e="📌";if(ks.length>1){const c=catsNow.expense.find(x=>x.k===ks[0]);if(c){e=c.e;const s=(c.subs||[]).find(x=>x.k===ks[1]);nm=s?c.n+"·"+s.n:c.n+"·"+ks[1]}}else{const c=catsNow.expense.find(x=>x.k===k);if(c){nm=c.n;e=c.e}}return{n:nm,e,value:v,key:k}});const md=[];for(let i=5;i>=0;i--){const d=new Date(S.fMonth);d.setMonth(d.getMonth()-i);const m=fm(d);const e=all.filter(t=>t.type==="expense"&&t.date.startsWith(m)).reduce((s,t)=>s+t.amount,0);const ii=all.filter(t=>t.type==="income"&&t.date.startsWith(m)).reduce((s,t)=>s+t.amount,0);md.push({month:(d.getMonth()+1)+"月",exp:e,inc:ii})};let html=`<div class="ph"><div><div class="pt">记账理财</div><div class="ps">${fmcn(S.fMonth)}</div></div><div class="row"><button class="btn bo bs" onclick="fCM(-1)">‹</button><button class="btn bo bs" onclick="fCM(1)">›</button></div></div><div class="fin-s"><div class="fc" style="border-left:3px solid var(--accent);cursor:pointer" onclick="fCardClick('expense')"><div class="v" style="color:var(--accent)">¥${exp.toFixed(0)}</div><div class="l">本月支出</div></div><div class="fc" style="border-left:3px solid var(--green);cursor:pointer" onclick="fCardClick('income')"><div class="v" style="color:var(--green)">¥${inc.toFixed(0)}</div><div class="l">本月收入</div></div><div class="fc" style="border-left:3px solid var(--blue);cursor:pointer" onclick="fCardClick('all')"><div class="v" style="color:var(--blue)">¥${net.toFixed(0)}</div><div class="l">结余</div></div></div><div class="card mb16" style="cursor:pointer" onclick="fEB()"><div class="row" style="justify-content:space-between"><span class="f13 fw6">预算 ${bpct.toFixed(0)}%</span><span class="f12 t2">¥${exp.toFixed(0)} / ¥${bud.total}</span></div><div class="bbar"><div class="fl" style="width:${bpct}%;background:${bc}"></div></div><div class="row mt8" style="justify-content:space-between"><button class="btn bo bs" onclick="event.stopPropagation();fEB()">设置预算</button><span class="f12 t2">剩余 ¥${Math.max(0,bud.total-exp).toFixed(0)}</span></div></div><div class="g2 mb16"><div class="card"><div class="row mb8" style="justify-content:space-between;flex-wrap:wrap;gap:6px"><h4 class="f13 fw7">消费结构</h4><div class="chips"><button class="chip ${lvl==="cat"?"active":""}" onclick="fLV('cat')">按大类</button><button class="chip ${lvl==="sub"?"active":""}" onclick="fLV('sub')">按细类</button></div></div>${catD.length>0?renderDonut(catD):'<div class="empty">暂无支出</div>'}</div><div class="card"><h4 class="f13 fw7 mb8">六月对比</h4>${renderBar(md)}</div></div><div class="row mb12" style="flex-wrap:wrap;gap:6px"><button class="chip ${S.fFilter==="all"?"active":""}" onclick="fSF('all')">全部</button>${FT.map(t=>`<button class="chip ${S.fFilter===t.k?"active":""}" onclick="fSF('${t.k}')">${t.n}</button>`).join("")}</div><div class="row mb12" style="gap:6px"><div style="flex:1;position:relative;display:flex;align-items:center"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="var(--t3)" stroke-width="2.2" style="position:absolute;left:10px;pointer-events:none"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg><input type="text" id="fSearchIn" value="${eh(S.fSearch)}" placeholder="搜索分类 / 子分类 / 备注，如：打车" oninput="fSearch(this.value)" style="width:100%;padding-left:30px"></div>${fq?`<button class="btn bo bs" style="flex-shrink:0" onclick="fSearch('')">清除</button>`:""}</div><div class="row mb12" style="flex-wrap:wrap;gap:6px"><button class="btn bp bs gw" onclick="fAdd()">+ 记一笔</button><button class="btn bo bs" onclick="fCSV()">导出CSV</button><button class="btn bo bs" onclick="fImportCSV()">导入</button><button class="btn bo bs" onclick="fCatMgr()">管理类目</button></div><div class="card" id="flist">${fq?`<div class="row mb8" style="justify-content:space-between;align-items:center"><span class="f12 t2">搜索「${eh(fq)}」命中 ${ql.length} 条</span><button class="btn bo bs" style="padding:2px 8px;font-size:11px" onclick="fSearch('')">× 清除</button></div>`:""}${ql.length===0?`<div class="empty">${fq?"未找到匹配记录":"暂无记录"}</div>`:ql.map(t=>{const cats=getCats()[t.type]||[];const cat=cats.find(c=>c.k===t.category)||{n:t.category,e:"📌"};const sub=t.sub?(cat.subs||[]).find(s=>s.k===t.sub):null;const ti=FT.find(x=>x.k===t.type)||{};return`<div class="ti" style="cursor:pointer" onclick="fEdit('${t.id}')"><div class="ti-ic" style="background:${ti.c}20">${cat.e||"📌"}</div><div class="ti-inf"><div class="c">${cat.n||t.category}${sub?` · ${sub.n}`:""}</div><div class="n">${t.date} ${t.note?eh(t.note):""}</div></div><div class="ti-am" style="color:${ti.c}">${t.type==="expense"||t.type==="lend"||t.type==="invest"?"-":"+"}¥${t.amount.toFixed(0)}</div><button class="btn bo bs" style="padding:2px 6px;font-size:11px;color:var(--red);margin-left:6px;flex-shrink:0" onclick="event.stopPropagation();fDel('${t.id}')">×</button></div>`}).join("")}</div>`;document.getElementById("page-finance").innerHTML=html}
function fLV(l){S.fLevel=l;renderFinance()}
function renderDonut(data){const tot=data.reduce((s,d)=>s+d.value,0);if(tot===0)return'<div class="empty">暂无数据</div>';const sz=140,r=55,cx=sz/2,cy=sz/2;const cols=["#FF6B6B","#FFB347","#6C9BCF","#4ECDC4","#A29BFE","#FD79A8","#95A5A6","#E74C3C"];let ang=-90,paths="";data.forEach((d,i)=>{const pct=d.value/tot;const ea=ang+pct*360;const sR=ang*Math.PI/180,eR=ea*Math.PI/180;const x1=cx+r*Math.cos(sR),y1=cy+r*Math.sin(sR),x2=cx+r*Math.cos(eR),y2=cy+r*Math.sin(eR);const lg=pct>0.5?1:0;paths+=`<path d="M${cx},${cy} L${x1},${y1} A${r},${r} 0 ${lg},1 ${x2},${y2} Z" fill="${cols[i%cols.length]}" onclick="fCatDetail('${(d.key||d.n).replace(/'/g,"\\'")}')" style="cursor:pointer"/>`;ang=ea});let leg=data.slice(0,5).map((d,i)=>`<div class="row" style="gap:4px;font-size:11px;cursor:pointer" onclick="fCatDetail('${(d.key||d.n).replace(/'/g,"\\'")}')"><span style="width:10px;height:10px;border-radius:2px;background:${cols[i%cols.length]}"></span><span class="t2">${d.n} ¥${d.value.toFixed(0)}</span></div>`).join("");return`<div class="row" style="align-items:center;gap:12px"><svg viewBox="0 0 ${sz} ${sz}" width="${sz}" height="${sz}">${paths}<circle cx="${cx}" cy="${cy}" r="${r*0.55}" fill="white"/><text x="${cx}" y="${cy-4}" text-anchor="middle" font-size="14" font-weight="700" fill="#3D3835">¥${tot.toFixed(0)}</text><text x="${cx}" y="${cy+12}" text-anchor="middle" font-size="9" fill="#8C8279">总计</text></svg><div class="col" style="flex:1;gap:4px">${leg}</div></div>`}
function renderBar(data){const mx=Math.max(...data.map(d=>Math.max(d.exp,d.inc)),1);const bw=18,gap=6,ch=80;const w=data.length*(bw*2+gap)+20;let bars="";data.forEach((d,i)=>{const x=i*(bw*2+gap)+10;const eh2=d.exp/mx*ch,ih=d.inc/mx*ch;bars+=`<rect x="${x}" y="${ch-eh2}" width="${bw}" height="${eh2}" rx="2" fill="#FF6B6B"/><rect x="${x+bw}" y="${ch-ih}" width="${bw}" height="${ih}" rx="2" fill="#4ECDC4"/><text x="${x+bw}" y="${ch+12}" text-anchor="middle" font-size="8" fill="#B8AFA6">${d.month}</text>`});return`<svg viewBox="0 0 ${w} 100" width="100%" height="100"><g>${bars}</g></svg><div class="row mt8" style="font-size:10px;color:var(--t3);gap:12px"><span><span style="display:inline-block;width:8px;height:8px;background:#FF6B6B;border-radius:2px"></span> 支出</span><span><span style="display:inline-block;width:8px;height:8px;background:#4ECDC4;border-radius:2px"></span> 收入</span></div>`}
function fCM(d){S.fMonth.setMonth(S.fMonth.getMonth()+d);S.fMonth=new Date(S.fMonth);renderFinance()}
function fSF(f){S.fFilter=f;renderFinance()}
function fSearch(v){S.fSearch=v;renderFinance()}
function fAdd(){const td=today();openModal(`<div class="mtitle">记一笔</div><div class="ig"><label>类型</label><div class="chips" id="ftc">${FT.map((t,i)=>`<button class="chip ${i===0?"active":""}" data-t="${t.k}" onclick="fST('${t.k}')">${t.n}</button>`).join("")}</div></div><div class="ig"><label>金额</label><input type="number" id="fAmt" placeholder="0.00" step="0.01" style="font-size:18px;font-weight:700"></div><div class="ig"><label>分类 <span class="t3" style="font-size:10px;font-weight:400;cursor:pointer" onclick="fCatMgr()">✎ 管理类目</span></label><div class="chips" id="fcc"></div><div class="chips" id="fsc" style="margin-top:8px;display:none"></div></div><div class="ig"><label>日期</label><input type="date" id="fDate" value="${td}"></div><div class="ig"><label>备注</label><input type="text" id="fNote" placeholder="可选"></div><div class="row mt12" style="gap:12px"><button class="btn bo gw" onclick="closeModal()">取消</button><button class="btn bp gw" onclick="fSave()">保存</button></div>`);S.ed.fType="expense";fRC("expense")}
function fST(t){S.ed.fType=t;document.querySelectorAll("#ftc .chip").forEach(c=>c.classList.toggle("active",c.dataset.t===t));fRC(t)}
function fRC(t){const cats=getCats()[t]||[];const b=document.getElementById("fcc");if(!b)return;b.innerHTML=cats.map((c,i)=>`<button class="chip ${i===0?"active":""}" data-c="${c.k}" onclick="this.parentElement.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));this.classList.add('active');fSC('${t}','${c.k}')">${c.e} ${c.n}${(c.subs||[]).length?`<span style="font-size:9px;opacity:.7">▾</span>`:""}</button>`).join("");fSC(t,cats[0]?.k)}
function fSC(t,ck){const b=document.getElementById("fsc");if(!b)return;const c=(getCats()[t]||[]).find(x=>x.k===ck);const subs=(c&&c.subs)||[];if(!subs.length){b.style.display="none";b.innerHTML="";return}b.style.display="flex";b.innerHTML=`<button class="chip active" data-s="" onclick="this.parentElement.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));this.classList.add('active')">不细分</button>`+subs.map(s=>`<button class="chip" data-s="${s.k}" onclick="this.parentElement.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));this.classList.add('active')">${s.n}</button>`).join("")}
function fSave(){const amt=parseFloat(document.getElementById("fAmt").value);if(!amt||amt<=0){toast("请输入有效金额");return}const t=S.ed.fType||"expense";const cc=document.querySelector("#fcc .chip.active");const cat=cc?cc.dataset.c:"other";const sc=document.querySelector("#fsc .chip.active");const sub=sc&&sc.dataset.s?sc.dataset.s:"";const date=document.getElementById("fDate").value||today();const note=document.getElementById("fNote").value.trim();const txns=LS.get("finance",[]);txns.push({id:uid(),type:t,amount:amt,category:cat,sub,date,note,createdAt:Date.now()});LS.set("finance",txns);closeModal();renderFinance();toast("已保存");checkBB()}
function fDel(id){let t=LS.get("finance",[]);t=t.filter(x=>x.id!==id);LS.set("finance",t);renderFinance();toast("已删除")}
function fCardClick(type){S.fFilter=type;renderFinance();setTimeout(()=>{const el=document.getElementById("flist");if(el)el.scrollIntoView({behavior:"smooth",block:"start"})},50)}
function fEdit(id){const txns=LS.get("finance",[]);const t=txns.find(x=>x.id===id);if(!t)return;const cats=getCats();const cat=(cats[t.type]||[]).find(c=>c.k===t.category)||{n:t.category,e:"📌"};const sub=t.sub?((cat.subs||[]).find(s=>s.k===t.sub)||{n:t.sub}):null;openModal(`<div class="mtitle">编辑记账</div><div class="ig"><label>类型</label><div class="chips" id="ftc">${FT.map((x,i)=>`<button class="chip ${x.k===t.type?"active":""}" data-t="${x.k}" onclick="fST('${x.k}')">${x.n}</button>`).join("")}</div></div><div class="ig"><label>分类</label><div class="chips" id="fcc"></div><div class="chips" id="fsc" style="margin-top:8px;display:none"></div></div><div class="ig"><label>金额</label><input type="number" id="fAmt" value="${t.amount}" step="0.01" style="font-size:18px;font-weight:700"></div><div class="ig"><label>日期</label><input type="date" id="fDate" value="${t.date}"></div><div class="ig"><label>备注</label><input type="text" id="fNote" value="${eh(t.note||"")}" placeholder="可选"></div><div class="row mt12" style="gap:12px;flex-wrap:wrap"><button class="btn bo" style="color:var(--red)" onclick="closeModal();fDel('${t.id}')">删除</button><button class="btn bo gw" onclick="closeModal()">取消</button><button class="btn bp gw" onclick="fEditSave()">保存</button></div>`);S.ed.fId=id;S.ed.fType=t.type;setTimeout(()=>{fST(t.type);setTimeout(()=>fSelCat(t.category,t.sub||""),0)},0)}
function fSelCat(cat,sub){const cc=document.querySelector(`#fcc .chip[data-c="${cat}"]`);if(!cc)return;document.querySelectorAll("#fcc .chip").forEach(x=>x.classList.remove("active"));cc.classList.add("active");fSC(S.ed.fType,cat);const sc=document.querySelector(`#fsc .chip[data-s="${sub}"]`);if(sc){document.querySelectorAll("#fsc .chip").forEach(x=>x.classList.remove("active"));sc.classList.add("active")}}
function fEditSave(){const txns=LS.get("finance",[]);const t=txns.find(x=>x.id===S.ed.fId);if(!t)return;const amt=parseFloat(document.getElementById("fAmt").value);if(!amt||amt<=0){toast("请输入有效金额");return}const tc=document.querySelector("#ftc .chip.active");const cc=document.querySelector("#fcc .chip.active");const sc=document.querySelector("#fsc .chip.active");if(tc)t.type=tc.dataset.t;if(cc)t.category=cc.dataset.c;t.sub=sc&&sc.dataset.s?sc.dataset.s:"";t.amount=amt;t.date=document.getElementById("fDate").value||t.date;t.note=document.getElementById("fNote").value.trim();LS.set("finance",txns);closeModal();renderFinance();toast("已更新")}
function fCatDetail(key){const fms=fm(S.fMonth);const all=LS.get("finance",[]);const mt=all.filter(t=>t.date.startsWith(fms)&&t.type==="expense");let list=[],title="";const cats=getCats();if(key.indexOf("::")>=0){const[ck,sk]=key.split("::");list=mt.filter(t=>t.category===ck&&t.sub===sk);const c=(cats.expense||[]).find(x=>x.k===ck)||{n:ck};const s=(c.subs||[]).find(x=>x.k===sk)||{n:sk};title=`${c.n} · ${s.n}`}else{list=mt.filter(t=>t.category===key);const c=(cats.expense||[]).find(x=>x.k===key)||{n:key};title=c.n}const tot=list.reduce((s,t)=>s+t.amount,0);openModal(`<div class="mtitle">${title} · ¥${tot.toFixed(0)}</div>${list.length===0?'<div class="empty">无记录</div>':list.map(t=>{const c=(cats[t.type]||[]).find(x=>x.k===t.category)||{n:t.category,e:"📌"};const sub=t.sub?(c.subs||[]).find(s=>s.k===t.sub):null;return`<div class="ti"><div class="ti-ic" style="background:#FF6B6B20">${c.e||"📌"}</div><div class="ti-inf"><div class="c">${c.n}${sub?` · ${sub.n}`:""}</div><div class="n">${t.date} ${eh(t.note||"")}</div></div><div class="ti-am" style="color:#FF6B6B">-¥${t.amount.toFixed(0)}</div></div>`}).join("")}<div class="row mt12"><button class="btn bp gw" onclick="closeModal()">关闭</button></div>`)}
function fEB(){const b=LS.get("budget",{total:5000});openModal(`<div class="mtitle">设置月度预算</div><div class="ig"><label>月度总预算 (¥)</label><input type="number" id="btot" value="${b.total}" step="100"></div><div class="row mt12" style="gap:12px"><button class="btn bo gw" onclick="closeModal()">取消</button><button class="btn bp gw" onclick="fSB()">保存</button></div>`)}
function fSB(){const tot=parseFloat(document.getElementById("btot").value)||5000;LS.set("budget",{total:tot});closeModal();renderFinance();toast("预算已更新")}
function fCSV(){const txns=LS.get("finance",[]);if(txns.length===0){toast("暂无数据");return}const tm={};FT.forEach(t=>tm[t.k]=t.n);const cm={};Object.values(getCats()).flat().forEach(c=>cm[c.k]=c.n);const sm={};Object.values(getCats()).flat().forEach(c=>(c.subs||[]).forEach(s=>sm[c.k+"::"+s.k]=s.n));let csv="\uFEFF日期,类型,金额,分类,子分类,备注\n";txns.sort((a,b)=>a.date.localeCompare(b.date)).forEach(t=>{csv+=`${t.date},${tm[t.type]||t.type},${t.amount},${cm[t.category]||t.category},${t.sub?(sm[t.category+"::"+t.sub]||t.sub):""},"${(t.note||"").replace(/"/g,'""')}"\n`});const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`记账_${today()}.csv`;a.click();toast("已导出CSV")}
function fImportCSV(){const inp=document.getElementById("fc");inp.onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const text=await f.text();const lines=text.replace(/\uFEFF/,"").split("\n").filter(l=>l.trim());if(lines.length<2){toast("CSV为空");return}const tr={};FT.forEach(t=>tr[t.n]=t.k);const cr={};Object.values(getCats()).flat().forEach(c=>cr[c.n]=c.k);const sr={};Object.values(getCats()).flat().forEach(c=>(c.subs||[]).forEach(s=>sr[c.n+"::"+s.n]=c.k+"::"+s.k));const txns=LS.get("finance",[]);let cnt=0;for(let i=1;i<lines.length;i++){const p=lines[i].match(/("[^"]*"|[^,]+)/g);if(!p||p.length<4)continue;const date=p[0].replace(/"/g,"").trim();const tn=p[1].replace(/"/g,"").trim();const amt=parseFloat(p[2].replace(/"/g,"").trim());const cn=p[3].replace(/"/g,"").trim();const hasSub=p.length>=6;const sn=hasSub?p[4].replace(/"/g,"").trim():"";const note=(hasSub?(p[5]?p[5].replace(/"/g,"").trim():""):(p[4]?p[4].replace(/"/g,"").trim():""));if(!date||!amt)continue;let cat=cr[cn]||cn||"other",sub="";if(hasSub&&sn){const skey=sr[cn+"::"+sn];if(skey){const sp=skey.split("::");cat=sp[0];sub=sp[1]}else sub=sn}txns.push({id:uid(),type:tr[tn]||"expense",amount:amt,category:cat,sub,date,note,createdAt:Date.now()});cnt++}LS.set("finance",txns);renderFinance();toast(`导入${cnt}条`);checkBB()}catch(err){toast("导入失败："+err.message)}e.target.value=""};inp.click()}
/* CATEGORY MANAGEMENT */
function fCatMgr(){openModal(`<div class="mtitle">管理类目</div><div class="chips mb12" id="fmtc">${FT.map((t,i)=>`<button class="chip ${i===0?"active":""}" data-t="${t.k}" onclick="fMT('${t.k}')">${t.n}</button>`).join("")}</div><div id="fmbody"></div><div class="row mt12" style="gap:12px;flex-wrap:wrap"><button class="btn bo bs gw" onclick="fCatAdd()">+ 新增一级类目</button><button class="btn bp bs gw" onclick="closeModal()">完成</button></div>`);S.mt="expense";fMT("expense")}
function fMT(t){S.mt=t;document.querySelectorAll("#fmtc .chip").forEach(c=>c.classList.toggle("active",c.dataset.t===t));const b=document.getElementById("fmbody");if(!b)return;const cats=getCats()[t]||[];if(!cats.length){b.innerHTML='<div class="empty" style="padding:20px">暂无类目，点下方按钮新增</div>';return}b.innerHTML=cats.map(c=>`<div class="fmc"><div class="fmh"><span>${c.e} ${c.n}</span><span class="row" style="gap:6px"><button class="btn bo bs" style="padding:2px 8px;font-size:11px" onclick="fSubAdd('${t}','${c.k}')">+ 子类</button><button class="btn bo bs" style="padding:2px 8px;font-size:11px;color:var(--red)" onclick="fCatDel('${t}','${c.k}')">删除</button></span></div><div class="fms">${(c.subs||[]).map(s=>`<span class="fmsub">${s.n}<b onclick="fSubDel('${t}','${c.k}','${s.k}')">×</b></span>`).join("")||'<span class="t3" style="font-size:11px">无子类目</span>'}</div></div>`).join("")}
function fCatAdd(){fPrompt("新增一级类目","输入类目名称，可用 emoji 开头，如：🏋 健身 / 宠物 / 房租",v=>{if(!v)return;const t=S.mt||"expense";const cats=getCats();const em=v.match(/\p{Extended_Pictographic}/u);const n=v.replace(/\p{Extended_Pictographic}/gu,"").trim()||v;const e=em?em[0]:"📌";cats[t]=cats[t]||[];cats[t].push({k:"u"+Date.now().toString(36),n,e,subs:[]});saveCats(cats);fMT(t);toast("已新增")})}
function fSubAdd(t,ck){fPrompt("新增子类目","输入子类目名称，如：水果 / 茶饮 / 食材 / 聚会",v=>{if(!v)return;const cats=getCats();const c=(cats[t]||[]).find(x=>x.k===ck);if(!c)return;c.subs=c.subs||[];c.subs.push({k:"s"+Date.now().toString(36),n:v});saveCats(cats);fMT(t);toast("已新增")})}
function fCatDel(t,ck){if(!confirm("删除后该一级类目不再出现在选项中；已有记录仍保留（统计按原名显示）。确认删除？"))return;const cats=getCats();cats[t]=cats[t].filter(x=>x.k!==ck);saveCats(cats);fMT(t);toast("已删除")}
function fSubDel(t,ck,sk){if(!confirm("删除该子类目？已有记录不受影响。"))return;const cats=getCats();const c=(cats[t]||[]).find(x=>x.k===ck);if(c&&c.subs)c.subs=c.subs.filter(x=>x.k!==sk);saveCats(cats);fMT(t);toast("已删除")}
function fPrompt(title,ph,cb){openModal(`<div class="mtitle">${title}</div><div class="ig"><input type="text" id="fpv" placeholder="${ph}"></div><div class="row mt12" style="gap:12px"><button class="btn bo gw" onclick="closeModal()">取消</button><button class="btn bp gw" onclick="fPromptOK()">确定</button></div>`);S.promptCb=cb;setTimeout(()=>{const i=document.getElementById("fpv");if(i)i.focus()},50)}
function fPromptOK(){const v=document.getElementById("fpv").value.trim();closeModal();if(S.promptCb&&v){const cb=S.promptCb;S.promptCb=null;cb(v)}else S.promptCb=null}

/* HABITS */
function renderHabits(){const habits=LS.get("habits",[]),logs=LS.get("habit_logs",[]),ds=fd(S.hDate),isT=ds===today();let html=`<div class="ph"><div><div class="pt">习惯健康</div><div class="ps">${fdcn(S.hDate)}</div></div><div class="row"><button class="btn bo bs" onclick="hCD(-1)">‹</button><button class="btn ${isT?"bo":"bp"} bs" onclick="hToday()">${isT?"今天":`${S.hDate.getMonth()+1}月${S.hDate.getDate()}日`}</button><button class="btn bo bs" onclick="hCD(1)">›</button></div></div><div class="row mb12" style="gap:8px"><button class="btn bp bs gw" onclick="hAdd()">+ 新建习惯</button></div>`;if(habits.length===0){html+=`<div class="card"><div class="empty">还没有习惯，添加一个开始坚持吧<br><span class="f12">支持勾选、计数、数值三种打卡方式</span></div></div>`;document.getElementById("page-habits").innerHTML=html;return}
let list=`<div class="habit-list"><div class="card"><div class="hl-head"><div class="lt">习惯打卡</div><div class="rt" onclick="hManage()">管理</div></div>`;habits.forEach((h,i)=>{const tl=logs.find(l=>l.habitId===h.id&&l.date===ds);const done=tl?.done||false;const stk=hStreak(h.id,logs);const col=HCOL[i%HCOL.length];let ctrl="";if(h.type==="check"){ctrl=`<div class="hck ${done?"done":""}" onclick="hPunch('${h.id}','check')">${done?"✓":""}</div>`}else if(h.type==="count"){const v=tl?.value||0;ctrl=`<div class="hctrl"><button class="btn bo bs" onclick="hPunch('${h.id}','count',-1)">-</button><span class="hp">${v}/${h.target||1}${h.unit||""}</span><button class="btn bp bs" onclick="hPunch('${h.id}','count',1)">+</button></div>`}else if(h.type==="value"){const v=tl?.value||"";ctrl=`<div class="hctrl"><input type="number" value="${v}" placeholder="${h.target||0}" onchange="hPunch('${h.id}','value',this.value)"><span class="hp">${h.unit||""}</span></div>`}list+=`<div class="hli"><span class="hdot" style="background:${col}"></span><span class="hn">${eh(h.name)}</span><span class="hp">${stk?stk+'天':(done?'已完成':'待打卡')}</span>${ctrl}</div>`});list+=`</div></div>`;
const days=[];const d0=new Date();d0.setDate(d0.getDate()-29);const tn=new Date();for(let i=0;i<30;i++){const dd=new Date(d0);dd.setDate(d0.getDate()+i);days.push(fd(dd))}
let map=`<div class="habit-map"><div class="hm-head"><div><div class="sub">连续发生 · 近30天</div><div class="tit">坚持，是有形状的</div></div><div class="tip">${d0.getMonth()+1}/${d0.getDate()} - ${tn.getMonth()+1}/${tn.getDate()} · 左右滑动</div></div><div class="hm-scroll"><div class="hm-days">${days.map((ds2,i)=>i%7===0?`<span style="left:${i*12+5}px">${new Date(ds2).getMonth()+1}/${new Date(ds2).getDate()}</span>`:"").join("")}</div>`;habits.forEach((h,i)=>{const l30=hLast30(h.id,logs);map+=`<div class="hm-row"><div class="lab">${eh(h.name)}</div><div class="hm-cells">${l30.map(v=>`<div class="hcell ${v?"l"+Math.min(4,Math.ceil(v*2)):""}"></div>`).join("")}</div></div>`});map+=`</div></div>`;
html+=list+map;document.getElementById("page-habits").innerHTML=html}
function hCD(d){S.hDate.setDate(S.hDate.getDate()+d);S.hDate=new Date(S.hDate);renderHabits()}
function hToday(){S.hDate=new Date();renderHabits()}
function hAdd(){openModal(`<div class="mtitle">新建习惯</div><div class="ig"><label>名称</label><input type="text" id="hName" placeholder="如：喝水、跑步、体重" maxlength="20"></div><div class="ig"><label>打卡方式</label><div class="chips" id="htc"><button class="chip active" data-t="check" onclick="hSelT('check')">勾选</button><button class="chip" data-t="count" onclick="hSelT('count')">计数</button><button class="chip" data-t="value" onclick="hSelT('value')">数值</button></div></div><div id="htg" style="display:none"><div class="ig"><label>目标值</label><input type="number" id="hTarget" value="1" placeholder="如：8杯"></div><div class="ig"><label>单位</label><input type="text" id="hUnit" placeholder="如：杯、kg、分钟"></div></div><div class="row mt12" style="gap:12px"><button class="btn bo gw" onclick="closeModal()">取消</button><button class="btn bp gw" onclick="hSave()">添加</button></div>`);S.ed.hType="check"}
function hSelT(t){S.ed.hType=t;document.querySelectorAll("#htc .chip").forEach(c=>c.classList.toggle("active",c.dataset.t===t));document.getElementById("htg").style.display=t==="check"?"none":"block"}
function hSave(){const name=document.getElementById("hName").value.trim();if(!name){toast("请输入名称");return}const t=S.ed.hType||"check";const icons=["✨","💧","🏃","📖","🧘","🎵","🌿","💊","🛌","🎯","💪","☀️"];const habits=LS.get("habits",[]);habits.push({id:uid(),name,type:t,icon:icons[habits.length%icons.length],target:t!=="check"?parseFloat(document.getElementById("hTarget")?.value||"1"):null,unit:t!=="check"?(document.getElementById("hUnit")?.value||""):"",createdAt:Date.now()});LS.set("habits",habits);closeModal();renderHabits();toast("已添加");checkBB()}
function hPunch(id,type,val){const ds=fd(S.hDate);const logs=LS.get("habit_logs",[]);const idx=logs.findIndex(l=>l.habitId===id&&l.date===ds);if(type==="check"){if(idx>=0){logs[idx].done=!logs[idx].done}else{logs.push({id:uid(),habitId:id,date:ds,done:true,value:1,createdAt:Date.now()})}}else if(type==="count"){const h=LS.get("habits",[]).find(x=>x.id===id);const tgt=h?.target||1;if(idx>=0){logs[idx].value=Math.max(0,(logs[idx].value||0)+val);logs[idx].done=logs[idx].value>=tgt}else{logs.push({id:uid(),habitId:id,date:ds,done:val>=tgt,value:Math.max(0,val),createdAt:Date.now()})}}else if(type==="value"){const h=LS.get("habits",[]).find(x=>x.id===id);const tgt=h?.target||0;const v=parseFloat(val)||0;if(idx>=0){logs[idx].value=v;logs[idx].done=v>=tgt}else{logs.push({id:uid(),habitId:id,date:ds,done:v>=tgt,value:v,createdAt:Date.now()})}}LS.set("habit_logs",logs);renderHabits()}
function hDel(id){if(!confirm("删除这个习惯及打卡记录？"))return;let h=LS.get("habits",[]);h=h.filter(x=>x.id!==id);LS.set("habits",h);let l=LS.get("habit_logs",[]);l=l.filter(x=>x.habitId!==id);LS.set("habit_logs",l);renderHabits();toast("已删除")}
function hManage(){const habits=LS.get("habits",[]);if(!habits.length){toast("还没有习惯");return}openModal(`<div class="mtitle">管理习惯</div><div class="col" style="gap:6px">${habits.map((h,i)=>`<div class="fmc"><div class="fmh"><span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${HCOL[i%HCOL.length]};margin-right:6px"></span>${eh(h.name)}</span><button class="btn bo bs" style="padding:2px 8px;font-size:11px;color:var(--red)" onclick="closeModal();hDel('${h.id}')">删除</button></div></div>`).join("")}</div><div class="row mt12"><button class="btn bp gw" onclick="closeModal()">完成</button></div>`)}
function hStreak(hid,logs){const done=logs.filter(l=>l.habitId===hid&&l.done).map(l=>l.date).sort();if(!done.length)return 0;let stk=0;const d=new Date();const td=today();while(true){const ds=fd(d);if(done.includes(ds)){stk++;d.setDate(d.getDate()-1)}else if(ds===td){d.setDate(d.getDate()-1)}else break}return stk}
function hLast30(hid,logs){const res=[];const d=new Date();d.setDate(d.getDate()-29);for(let i=0;i<30;i++){const ds=fd(d);const lg=logs.find(l=>l.habitId===hid&&l.date===ds);if(lg){if(lg.done)res.push(1);else if(lg.value)res.push(Math.min(1,lg.value/2));else res.push(0)}else res.push(0);d.setDate(d.getDate()+1)}return res}

/* FITNESS */
function renderFitness(){const recs=LS.get("fitness",[]).sort((a,b)=>a.date.localeCompare(b.date));const goal=LS.get("fgoal",{height:170,tw:65,tbf:18});const wp=LS.get("wplan",{"一":"跑步","二":"力量","三":"休息","四":"跑步","五":"瑜伽","六":"游泳","日":"休息"});const defs=LS.get("cdef",[]);const td=today();const tdef=defs.find(d=>d.date===td);const latest=recs.length>0?recs[recs.length-1]:null;const lw=latest?.weight||0;const lbf=latest?.bodyFat||0;const bmi=lw>0&&goal.height>0?(lw/Math.pow(goal.height/100,2)).toFixed(1):"--";const bn=parseFloat(bmi);let bs="正常",bc="var(--green)";if(bn<18.5){bs="偏瘦";bc="var(--blue)"}else if(bn>=24){bs="偏胖";bc="var(--gold)"}else if(bn>=28){bs="肥胖";bc="var(--accent)"}const wpct=lw>0&&goal.tw>0?Math.min(100,Math.max(0,(1-Math.abs(lw-goal.tw)/Math.max(lw,goal.tw))*100)):0;let html=`<div class="ph"><div class="pt">减脂健身</div><button class="btn bp bs" onclick="fitAdd()">+ 记录</button></div><div class="g2 mb16"><div class="card"><label>最新体重</label><div class="row" style="justify-content:space-between;align-items:center"><div class="f20 fw8" style="color:var(--accent)">${lw||"--"} <span class="f13 t2">kg</span></div><button class="btn bo bs" style="padding:2px 10px;font-size:12px" onclick="fitEdit()">✏️ 修改</button></div>${lbf?`<div class="f13 t2 mt8">体脂率 ${lbf}%</div>`:""}<div class="div"></div><label>目标</label><div class="f16 fw7">${goal.tw}kg / ${goal.tbf}%</div><div class="bbar"><div class="fl" style="width:${wpct}%;background:var(--green)"></div></div><div class="f11 t3 mt8">进度 ${wpct.toFixed(0)}%</div></div><div class="card"><label>BMI 指数</label><div class="row mt8" style="align-items:center;gap:16px"><div style="position:relative;width:80px;height:80px"><svg width="80" height="80" viewBox="0 0 80 80" style="transform:rotate(-90deg)"><circle cx="40" cy="40" r="34" fill="none" stroke="var(--bg-soft)" stroke-width="6"/><circle cx="40" cy="40" r="34" fill="none" stroke="${bc}" stroke-width="6" stroke-linecap="round" stroke-dasharray="${2*Math.PI*34}" stroke-dashoffset="${2*Math.PI*34*(1-Math.min(1,bn/40))}"/></svg><div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:${bc}">${bmi}</div></div><div><div class="f13 fw6" style="color:${bc}">${bs}</div><div class="f12 t2">身高 ${goal.height}cm</div><div class="f12 t2">标准 18.5-24</div></div></div><button class="btn bo bs mt8" onclick="fitEG()">设置目标</button></div></div><div class="wc"><h4 class="f14 fw7 mb8">体重趋势 ${recs.length>0?`(${recs.length}条)`:""}</h4>${recs.length>1?renderWChart(recs):'<div class="empty">至少记录2次体重才能看到趋势</div>'}</div><div class="card mb16"><h4 class="f14 fw7 mb8">今日热量缺口</h4><div class="row" style="gap:10px;flex-wrap:wrap"><div class="cs gw" style="text-align:center;min-width:100px"><div class="f16 fw8" style="color:var(--accent)">${tdef?.intake||0}</div><div class="f11 t2">摄入(kcal)</div></div><div class="cs gw" style="text-align:center;min-width:100px"><div class="f16 fw8" style="color:var(--green)">${tdef?.burn||0}</div><div class="f11 t2">消耗(kcal)</div></div><div class="cs gw" style="text-align:center;min-width:100px"><div class="f16 fw8" style="color:${(tdef?.intake||0)<(tdef?.burn||0)?"var(--green)":"var(--accent)"}">${(tdef?.burn||0)-(tdef?.intake||0)}</div><div class="f11 t2">缺口(kcal)</div></div></div><button class="btn bo bs mt8" onclick="fitLogDef()">记录热量</button></div><div class="card"><div class="row" style="justify-content:space-between"><h4 class="f14 fw7">周运动计划</h4><button class="btn bo bs" onclick="fitEP()">编辑</button></div><div class="g4 mt8" style="grid-template-columns:repeat(7,1fr)">${["一","二","三","四","五","六","日"].map(d=>`<div class="cs" style="padding:8px 4px;text-align:center;min-height:60px;${wp[d]==="休息"?"background:var(--bg-soft)":""}"><div class="f11 fw6 t2">周${d}</div><div class="f11 mt8">${eh(wp[d]||"")}</div></div>`).join("")}</div></div>`;document.getElementById("page-fitness").innerHTML=html}
function renderWChart(recs){const data=recs.slice(-30);if(data.length<2)return'<div class="empty">数据不足</div>';const ws=data.map(d=>d.weight);const mn=Math.min(...ws)-1,mx=Math.max(...ws)+1,rg=mx-mn||1;const w=300,h=120,pad=20,sx=(w-pad*2)/Math.max(1,data.length-1);const ma7=ws.map((_,i)=>{const st=Math.max(0,i-6);const sl=ws.slice(st,i+1);return sl.reduce((s,v)=>s+v,0)/sl.length});let lp="",mp="",dots="";data.forEach((d,i)=>{const x=pad+i*sx;const y=h-pad-(d.weight-mn)/rg*(h-pad*2);lp+=i===0?`M${x},${y}`:` L${x},${y}`;dots+=`<circle cx="${x}" cy="${y}" r="2.5" fill="#FF6B6B"/>`;const my=h-pad-(ma7[i]-mn)/rg*(h-pad*2);mp+=i===0?`M${x},${my}`:` L${x},${my}`});return`<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}"><line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="var(--border)" stroke-width="1"/><line x1="${pad}" y1="${pad}" x2="${pad}" y2="${h-pad}" stroke="var(--border)" stroke-width="1"/><text x="${pad-4}" y="${pad+4}" text-anchor="end" font-size="9" fill="#B8AFA6">${mx.toFixed(1)}</text><text x="${pad-4}" y="${h-pad+2}" text-anchor="end" font-size="9" fill="#B8AFA6">${mn.toFixed(1)}</text><path d="${lp}" fill="none" stroke="#FF6B6B" stroke-width="2" stroke-linejoin="round"/><path d="${mp}" fill="none" stroke="#4ECDC4" stroke-width="2" stroke-dasharray="4,3" stroke-linejoin="round"/>${dots}</svg><div class="row mt8" style="font-size:10px;color:var(--t3);gap:12px"><span><span style="display:inline-block;width:12px;height:2px;background:#FF6B6B"></span> 体重</span><span><span style="display:inline-block;width:12px;height:2px;background:#4ECDC4;border-top:1px dashed"></span> 7日均线</span></div>`}
function fitAdd(){openModal(`<div class="mtitle">记录体重</div><div class="ig"><label>日期</label><input type="date" id="fd" value="${today()}"></div><div class="ig"><label>体重 (kg)</label><input type="number" id="fw" step="0.1" placeholder="如 65.5"></div><div class="ig"><label>体脂率 (%)</label><input type="number" id="fbf" step="0.1" placeholder="如 18.5"></div><div class="ig"><label>备注</label><input type="text" id="fn" placeholder="可选"></div><div class="row mt12" style="gap:12px"><button class="btn bo gw" onclick="closeModal()">取消</button><button class="btn bp gw" onclick="fitSave()">保存</button></div>`)}
function fitSave(){const date=document.getElementById("fd").value||today();const w=parseFloat(document.getElementById("fw").value);const bf=parseFloat(document.getElementById("fbf").value)||0;const note=document.getElementById("fn").value.trim();if(!w||w<=0){toast("请输入体重");return}const recs=LS.get("fitness",[]);const idx=recs.findIndex(r=>r.date===date);const entry={id:uid(),date,weight:w,bodyFat:bf,note,createdAt:Date.now()};if(idx>=0)recs[idx]=entry;else recs.push(entry);LS.set("fitness",recs);closeModal();renderFitness();toast("已保存");checkBB()}
function fitEdit(){const recs=LS.get("fitness",[]);const lt=recs.length?recs[recs.length-1]:null;openModal(`<div class="mtitle">编辑体重</div><div class="ig"><label>日期</label><input type="date" id="fd" value="${lt?lt.date:today()}"></div><div class="ig"><label>体重 (kg)</label><input type="number" id="fw" step="0.1" value="${lt?lt.weight:""}" placeholder="如 65.5"></div><div class="ig"><label>体脂率 (%)</label><input type="number" id="fbf" step="0.1" value="${lt&&lt.bodyFat?lt.bodyFat:""}" placeholder="如 18.5"></div><div class="ig"><label>备注</label><input type="text" id="fn" value="${lt?(lt.note||""):""}" placeholder="可选"></div><div class="row mt12" style="gap:12px"><button class="btn bo gw" onclick="closeModal()">取消</button><button class="btn bp gw" onclick="fitSave()">保存</button></div>`)}
function fitEG(){const g=LS.get("fgoal",{height:170,tw:65,tbf:18});openModal(`<div class="mtitle">设置目标</div><div class="ig"><label>身高 (cm)</label><input type="number" id="gh" value="${g.height}"></div><div class="ig"><label>目标体重 (kg)</label><input type="number" id="gw" value="${g.tw}" step="0.5"></div><div class="ig"><label>目标体脂率 (%)</label><input type="number" id="gbf" value="${g.tbf}" step="0.5"></div><div class="row mt12" style="gap:12px"><button class="btn bo gw" onclick="closeModal()">取消</button><button class="btn bp gw" onclick="fitSG()">保存</button></div>`)}
function fitSG(){LS.set("fgoal",{height:parseFloat(document.getElementById("gh").value)||170,tw:parseFloat(document.getElementById("gw").value)||65,tbf:parseFloat(document.getElementById("gbf").value)||18});closeModal();renderFitness();toast("目标已更新")}
function fitLogDef(){const td=today();const defs=LS.get("cdef",[]);const ex=defs.find(d=>d.date===td);openModal(`<div class="mtitle">今日热量记录</div><div class="ig"><label>摄入热量 (kcal)</label><input type="number" id="di" value="${ex?.intake||""}" placeholder="如 1800"></div><div class="ig"><label>运动消耗 (kcal)</label><input type="number" id="db" value="${ex?.burn||""}" placeholder="如 500"></div><div class="row mt12" style="gap:12px"><button class="btn bo gw" onclick="closeModal()">取消</button><button class="btn bp gw" onclick="fitSaveDef()">保存</button></div>`)}
function fitSaveDef(){const td=today();const intake=parseFloat(document.getElementById("di").value)||0;const burn=parseFloat(document.getElementById("db").value)||0;const defs=LS.get("cdef",[]);const idx=defs.findIndex(d=>d.date===td);const entry={id:uid(),date:td,intake,burn,createdAt:Date.now()};if(idx>=0)defs[idx]=entry;else defs.push(entry);LS.set("cdef",defs);closeModal();renderFitness();toast("已保存")}
function fitEP(){const wp=LS.get("wplan",{"一":"跑步","二":"力量","三":"休息","四":"跑步","五":"瑜伽","六":"游泳","日":"休息"});const days=["一","二","三","四","五","六","日"];openModal(`<div class="mtitle">编辑周计划</div>${days.map(d=>`<div class="ig"><label>周${d}</label><input type="text" id="wp${d}" value="${eh(wp[d]||"")}" placeholder="如：跑步/力量/休息"></div>`).join("")}<div class="row mt12" style="gap:12px"><button class="btn bo gw" onclick="closeModal()">取消</button><button class="btn bp gw" onclick="fitSavePlan()">保存</button></div>`)}
function fitSavePlan(){const days=["一","二","三","四","五","六","日"];const plan={};days.forEach(d=>{plan[d]=document.getElementById("wp"+d).value.trim()||"休息"});LS.set("wplan",plan);closeModal();renderFitness();toast("计划已更新")}

/* SCHEDULE */
function renderSchedule(){const todos=LS.get("todos",[]).sort((a,b)=>{if(a.done!==b.done)return a.done?1:-1;const po={p0:0,p1:1,p2:2};if(po[a.priority]!==po[b.priority])return po[a.priority]-po[b.priority];return(a.date||"").localeCompare(b.date||"")});const td=today();const od=todos.filter(t=>!t.done&&t.date<td);const tt=todos.filter(t=>t.date===td);const fu=todos.filter(t=>!t.done&&t.date>td);const dn=todos.filter(t=>t.done);let html=`<div class="ph"><div class="pt">日程统筹</div><button class="btn bp bs" onclick="tdAdd()">+ 待办</button></div>`;const rg=(title,list)=>{if(list.length===0)return"";return`<h3 class="f13 fw7 t2 mb8">${title} (${list.length})</h3>${list.map(t=>{const pc=t.priority==="p0"?"var(--accent)":t.priority==="p1"?"var(--gold)":"var(--blue)";const pn=t.priority==="p0"?"紧急":t.priority==="p1"?"重要":"普通";return`<div class="todo-it"><div class="pd ${t.priority}"></div><div class="tdck ${t.done?"done":""}" onclick="tdToggle('${t.id}')">${t.done?"✓":""}</div><div class="tdc ${t.done?"done":""}"><div class="tt">${eh(t.title)}</div><div class="tm">${t.date} ${t.remindTime?t.remindTime:""} · ${pn}${t.note?" · "+eh(t.note):""}</div></div><button class="btn bo bs" style="padding:2px 6px;font-size:11px" onclick="tdDel('${t.id}')">×</button></div>`}).join("")}`};if(todos.length===0){html+=`<div class="card"><div class="empty">暂无待办事项</div></div>`}else{html+=rg("逾期",od)+rg("今天",tt)+rg("待办",fu)+rg("已完成",dn)}document.getElementById("page-schedule").innerHTML=html}
function tdAdd(){openModal(`<div class="mtitle">新增待办</div><div class="ig"><label>标题</label><input type="text" id="tdTitle" placeholder="如：取快递、开会"></div><div class="g2"><div class="ig"><label>日期</label><input type="date" id="tdDate" value="${today()}"></div><div class="ig"><label>提醒时间</label><input type="time" id="tdTime"></div></div><div class="ig"><label>优先级</label><div class="chips" id="tdPrio"><button class="chip active" data-p="p0" onclick="tdSP('p0')">紧急</button><button class="chip" data-p="p1" onclick="tdSP('p1')">重要</button><button class="chip" data-p="p2" onclick="tdSP('p2')">普通</button></div></div><div class="ig"><label>备注</label><input type="text" id="tdNote" placeholder="可选"></div><div class="row mt12" style="gap:12px"><button class="btn bo gw" onclick="closeModal()">取消</button><button class="btn bp gw" onclick="tdSave()">添加</button></div>`);S.ed.tdP="p0"}
function tdSP(p){S.ed.tdP=p;document.querySelectorAll("#tdPrio .chip").forEach(c=>c.classList.toggle("active",c.dataset.p===p))}
function tdSave(){const title=document.getElementById("tdTitle").value.trim();if(!title){toast("请输入标题");return}const todos=LS.get("todos",[]);todos.push({id:uid(),title,date:document.getElementById("tdDate").value||today(),remindTime:document.getElementById("tdTime").value||"",priority:S.ed.tdP||"p2",note:document.getElementById("tdNote").value.trim(),done:false,createdAt:Date.now()});LS.set("todos",todos);closeModal();renderSchedule();toast("已添加");checkBB()}
function tdToggle(id){const todos=LS.get("todos",[]);const t=todos.find(x=>x.id===id);if(t){t.done=!t.done;t.completedAt=t.done?Date.now():null;LS.set("todos",todos);renderSchedule()}}
function tdDel(id){let t=LS.get("todos",[]);t=t.filter(x=>x.id!==id);LS.set("todos",t);renderSchedule();toast("已删除")}

/* SHOPPING */
function renderShopping(){const items=LS.get("shopping",[]);const active=items.filter(s=>!s.bought).sort((a,b)=>{const po={high:0,mid:1,low:2};return(po[a.priority]||1)-(po[b.priority]||1)});const done=items.filter(s=>s.bought);const tot=active.reduce((s,i)=>s+(i.price||0),0);let html=`<div class="ph"><div class="pt">待买清单</div><button class="btn bp bs" onclick="shAdd()">+ 添加</button></div><div class="card mb16"><div class="row" style="justify-content:space-between"><span class="f13 t2">待买 ${active.length} 件 · 已买 ${done.length} 件</span><span class="f16 fw7" style="color:var(--accent)">预估 ¥${tot.toFixed(0)}</span></div></div>`;if(active.length>0){html+=`<h3 class="f13 fw7 t2 mb8">待购买</h3>`;active.forEach(s=>{const pt=s.priority==="high"?'<span class="tag tr-tag">急</span>':s.priority==="low"?'<span class="tag tgray">低</span>':"";html+=`<div class="shop-it"><div class="shck" onclick="shToggle('${s.id}')"></div><div class="shi"><div class="sn">${eh(s.name)}</div><div class="sm2">${s.store||""} ${pt}</div></div>${s.price?`<div class="shp">¥${s.price}</div>`:""}<button class="btn bo bs" style="padding:2px 6px;font-size:11px" onclick="shDel('${s.id}')">×</button></div>`})}if(done.length>0){html+=`<h3 class="f13 fw7 t2 mb8 mt16">已购买</h3>`;done.forEach(s=>{html+=`<div class="shop-it"><div class="shck done" onclick="shToggle('${s.id}')">✓</div><div class="shi done"><div class="sn">${eh(s.name)}</div><div class="sm2">${s.date}</div></div>${s.price?`<div class="shp" style="color:var(--t3)">¥${s.price}</div>`:""}<button class="btn bo bs" style="padding:2px 6px;font-size:11px" onclick="shDel('${s.id}')">×</button></div>`})}if(items.length===0)html+=`<div class="card"><div class="empty">清单是空的，添加需要买的东西吧</div></div>`;document.getElementById("page-shopping").innerHTML=html}
function shAdd(){openModal(`<div class="mtitle">添加待买</div><div class="ig"><label>名称</label><input type="text" id="shName" placeholder="如：牛奶、纸巾"></div><div class="g2"><div class="ig"><label>预估价格 (¥)</label><input type="number" id="shPrice" step="0.01" placeholder="0.00"></div><div class="ig"><label>购买渠道</label><input type="text" id="shStore" placeholder="如：京东、超市"></div></div><div class="ig"><label>优先级</label><div class="chips" id="shPrio"><button class="chip active" data-p="mid" onclick="shSP('mid')">普通</button><button class="chip" data-p="high" onclick="shSP('high')">急买</button><button class="chip" data-p="low" onclick="shSP('low')">不急</button></div></div><div class="ig"><label>备注</label><input type="text" id="shNote" placeholder="可选"></div><div class="row mt12" style="gap:12px"><button class="btn bo gw" onclick="closeModal()">取消</button><button class="btn bp gw" onclick="shSave()">添加</button></div>`);S.ed.shP="mid"}
function shSP(p){S.ed.shP=p;document.querySelectorAll("#shPrio .chip").forEach(c=>c.classList.toggle("active",c.dataset.p===p))}
function shSave(){const name=document.getElementById("shName").value.trim();if(!name){toast("请输入名称");return}const items=LS.get("shopping",[]);items.push({id:uid(),name,price:parseFloat(document.getElementById("shPrice").value)||0,store:document.getElementById("shStore").value.trim(),priority:S.ed.shP||"mid",note:document.getElementById("shNote").value.trim(),bought:false,date:today(),createdAt:Date.now()});LS.set("shopping",items);closeModal();renderShopping();toast("已添加");checkBB()}
function shToggle(id){const items=LS.get("shopping",[]);const s=items.find(x=>x.id===id);if(s){s.bought=!s.bought;LS.set("shopping",items);renderShopping()}}
function shDel(id){let items=LS.get("shopping",[]);items=items.filter(x=>x.id!==id);LS.set("shopping",items);renderShopping();toast("已删除")}

/* MEDIA */
const MT=[{k:"book",n:"书籍",e:"📖"},{k:"movie",n:"电影",e:"🎬"},{k:"music",n:"音乐",e:"🎵"},{k:"tv",n:"剧集",e:"📺"}];
const MS=[{k:"want",n:"想看/读"},{k:"doing",n:"在看/读"},{k:"done",n:"看过/读过"}];
function renderMedia(){const items=LS.get("media",[]);const q=(S.mSearch||"").trim().toLowerCase();const hasFilter=q||S.mTag;const allTags=[...new Set(items.flatMap(m=>m.tags||[]))].sort();const tagChips=allTags.map(t=>`<button class="chip ${S.mTag===t?"active":""}" onclick="mTagFilter('${t.replace(/'/g,"\\'")}')">#${t}</button>`).join("");let fl=items.filter(m=>S.mFilter==="all"||m.type===S.mFilter);fl=fl.filter(m=>{const okQ=!q||((m.title||"").toLowerCase().includes(q))||((m.author||"").toLowerCase().includes(q))||((m.review||"").toLowerCase().includes(q));const okT=!S.mTag||(m.tags||[]).includes(S.mTag);return okQ&&okT});let html=`<div class="ph"><div><div class="pt">书影音收藏</div><div class="ps">共 ${items.length} 条</div></div><div class="row"><button class="btn bo bs" onclick="mTV()">${S.mView==="grid"?"列表":"封面墙"}</button><button class="btn bp bs" onclick="mAdd()">+ 添加</button></div></div><div class="g4 mb16">${MT.map(t=>{const c=items.filter(m=>m.type===t.k).length;return`<div class="sm"><div class="v" style="font-size:16px">${c}</div><div class="l">${t.e} ${t.n}</div></div>`}).join("")}</div><div class="card mb12"><div class="ig" style="margin-bottom:6px"><label>🔍 搜索 / 标签筛选</label><input type="text" id="mSearchIn" value="${eh(S.mSearch)}" placeholder="搜索标题、作者、短评..." oninput="mSearch(this.value)"></div>${(S.mTag||allTags.length)?`<div class="chips">${S.mTag?`<button class="chip active" onclick="mTagFilter('')">#${S.mTag} ×</button>`:""}${tagChips}</div>`:""}</div><div class="row mb12" style="flex-wrap:wrap;gap:6px"><button class="chip ${S.mFilter==="all"?"active":""}" onclick="mSF('all')">全部</button>${MT.map(t=>`<button class="chip ${S.mFilter===t.k?"active":""}" onclick="mSF('${t.k}')">${t.e} ${t.n}</button>`).join("")}</div>${hasFilter?`<div class="f12 t3 mb8">${S.mTag?"标签 #"+eh(S.mTag):""}${q?" · 关键字 “"+eh(S.mSearch)+"”":""} 命中 ${fl.length} 条</div>`:""}`;if(fl.length===0){html+=`<div class="card"><div class="empty">${hasFilter?"没有符合条件的收藏":"还没有收藏，添加一本/一部吧"}</div></div>`}else if(S.mView==="grid"){html+=`<div class="media-g">`;fl.forEach(m=>{const ti=MT.find(t=>t.k===m.type)||{};const si=MS.find(s=>s.k===m.status)||{};html+=`<div class="md-card" onclick="mDetail('${m.id}')"><div class="md-cov">${m.cover?`<img src="${m.cover}">`:ti.e||"📖"}</div><div class="md-inf"><div class="t">${eh(m.title)}</div><div class="m">${si.n||""} ${m.rating?"·"+"★".repeat(m.rating):""}</div>${m.tags&&m.tags.length?`<div class="m" style="font-size:11px;color:var(--t3)">${m.tags.map(t=>"#"+t).join(" ")}</div>`:""}</div></div>`});html+="</div>"}else{html+=fl.map(m=>{const ti=MT.find(t=>t.k===m.type)||{};const si=MS.find(s=>s.k===m.status)||{};return`<div class="ml-it" onclick="mDetail('${m.id}')"><div class="ml-cov">${m.cover?`<img src="${m.cover}">`:ti.e||"📖"}</div><div class="ml-inf"><div class="t">${eh(m.title)} ${ti.e}</div><div class="m">${m.author||""} · ${si.n||""} · ${m.date||""}</div>${m.rating?`<div class="star-r">${"★".repeat(m.rating)}${"☆".repeat(5-m.rating)}</div>`:""}${m.tags&&m.tags.length?`<div class="m">${tagHTML(m.tags,"mTagFilter")}</div>`:""}${m.review?`<div class="r">${eh(m.review)}</div>`:""}</div></div>`}).join("")}document.getElementById("page-media").innerHTML=html}
function mSF(f){S.mFilter=f;renderMedia()}
function mTV(){S.mView=S.mView==="grid"?"list":"grid";renderMedia()}
function mAdd(){openModal(`<div class="mtitle">添加收藏</div><div class="ig"><label>类型</label><div class="chips" id="mtc">${MT.map((t,i)=>`<button class="chip ${i===0?"active":""}" data-t="${t.k}" onclick="mSelT('${t.k}')">${t.e} ${t.n}</button>`).join("")}</div></div><div class="ig"><label>标题</label><input type="text" id="mTitle" placeholder="书名/电影名/专辑名"></div><div class="ig"><label>作者/导演/歌手</label><input type="text" id="mAuthor" placeholder="可选"></div><div class="g2"><div class="ig"><label>状态</label><select id="mStatus">${MS.map(s=>`<option value="${s.k}">${s.n}</option>`).join("")}</select></div><div class="ig"><label>评分</label><select id="mRating"><option value="0">未评分</option>${[5,4,3,2,1].map(n=>`<option value="${n}">${"★".repeat(n)}</option>`).join("")}</select></div></div><div class="ig"><label>标签</label><input type="text" id="mTags" placeholder="用空格或逗号分隔，如：治愈 推理"></div><div class="ig"><label>短评</label><textarea id="mReview" placeholder="一句话感受..." style="min-height:50px"></textarea></div><div class="ig"><label>封面</label><div class="row"><button class="btn bo bs" onclick="mPickCov()">+ 上传封面</button><span class="f12 t3" id="covStatus">可选</span></div></div><div class="row mt12" style="gap:12px"><button class="btn bo gw" onclick="closeModal()">取消</button><button class="btn bp gw" onclick="mSave()">添加</button></div>`);S.ed.mType="book";S.ed.mCov=null}
function mSelT(t){S.ed.mType=t;document.querySelectorAll("#mtc .chip").forEach(c=>c.classList.toggle("active",c.dataset.t===t))}
function mPickCov(){pickImg(img=>{S.ed.mCov=img;document.getElementById("covStatus").textContent="已上传"})}
function mSave(){const title=document.getElementById("mTitle").value.trim();if(!title){toast("请输入标题");return}const items=LS.get("media",[]);items.push({id:uid(),type:S.ed.mType||"book",title,author:document.getElementById("mAuthor").value.trim(),status:document.getElementById("mStatus").value,rating:parseInt(document.getElementById("mRating").value)||0,tags:parseTags(document.getElementById("mTags").value),review:document.getElementById("mReview").value.trim(),cover:S.ed.mCov||null,date:today(),createdAt:Date.now()});LS.set("media",items);closeModal();renderMedia();toast("已添加");checkBB()}
function mDetail(id){const m=LS.get("media",[]).find(x=>x.id===id);if(!m)return;const ti=MT.find(t=>t.k===m.type)||{};const si=MS.find(s=>s.k===m.status)||{};openModal(`<div class="mtitle">${eh(m.title)} ${ti.e}</div>${m.cover?`<img src="${m.cover}" style="width:100%;border-radius:8px;margin-bottom:12px;max-height:200px;object-fit:cover">`:""}<div class="col mb12" style="gap:4px">${m.author?`<div class="f13 t2">${eh(m.author)}</div>`:""}<div class="row" style="gap:4px;flex-wrap:wrap"><span class="tag tgray">${si.n||""}</span>${m.rating?`<span class="star-r">${"★".repeat(m.rating)}${"☆".repeat(5-m.rating)}</span>`:""}</div>${m.tags&&m.tags.length?`<div class="row" style="gap:4px;flex-wrap:wrap;margin-top:4px">${m.tags.map(t=>`<span class="tag tb-tag">#${t}</span>`).join("")}</div>`:""}<div class="f12 t3">添加于 ${m.date}</div></div>${m.review?`<div class="cs mb8"><div class="f13" style="line-height:1.6">${eh(m.review)}</div></div>`:""}<div class="row" style="gap:12px"><button class="btn bo gw" onclick="mEdit('${m.id}')">编辑</button><button class="btn bo" style="color:var(--red)" onclick="mDel('${m.id}')">删除</button><button class="btn bp gw" onclick="closeModal()">关闭</button></div>`)}
function mDel(id){if(!confirm("删除这条收藏？"))return;let items=LS.get("media",[]);items=items.filter(x=>x.id!==id);LS.set("media",items);closeModal();renderMedia();toast("已删除")}
function mSearch(v){S.mSearch=v;renderMedia();const inp=document.getElementById("mSearchIn");if(inp){inp.focus();const len=inp.value.length;inp.setSelectionRange(len,len)}}
function mTagFilter(tag){S.mTag=S.mTag===tag?"":tag;renderMedia()}
function mEdit(id){const items=LS.get("media",[]);const m=items.find(x=>x.id===id);if(!m)return;S.ed.me={...m};openModal(`<div class="mtitle">编辑收藏</div><div class="ig"><label>类型</label><div class="chips" id="metc">${MT.map(t=>`<button class="chip ${m.type===t.k?"active":""}" data-t="${t.k}" onclick="mSelE('${t.k}')">${t.e} ${t.n}</button>`).join("")}</div></div><div class="ig"><label>标题</label><input type="text" id="meTitle" value="${eh(m.title)}"></div><div class="ig"><label>作者/导演/歌手</label><input type="text" id="meAuthor" value="${eh(m.author||"")}"></div><div class="g2"><div class="ig"><label>状态</label><select id="meStatus">${MS.map(s=>`<option value="${s.k}" ${m.status===s.k?"selected":""}>${s.n}</option>`).join("")}</select></div><div class="ig"><label>评分</label><select id="meRating"><option value="0">未评分</option>${[5,4,3,2,1].map(n=>`<option value="${n}" ${m.rating===n?"selected":""}>${"★".repeat(n)}</option>`).join("")}</select></div></div><div class="ig"><label>标签</label><input type="text" id="meTags" value="${eh((m.tags||[]).join(" "))}" placeholder="用空格或逗号分隔"></div><div class="ig"><label>短评</label><textarea id="meReview" style="min-height:60px">${eh(m.review||"")}</textarea></div><div class="row" style="gap:12px"><button class="btn bo gw" onclick="closeModal()">取消</button><button class="btn bp gw" onclick="mEditSave('${m.id}')">保存</button></div>`)}
function mSelE(t){S.ed.me.type=t;document.querySelectorAll("#metc .chip").forEach(c=>c.classList.toggle("active",c.dataset.t===t))}
function mEditSave(id){const items=LS.get("media",[]);const m=items.find(x=>x.id===id);if(!m)return;m.type=S.ed.me.type||m.type;m.title=document.getElementById("meTitle").value.trim();m.author=document.getElementById("meAuthor").value.trim();m.status=document.getElementById("meStatus").value;m.rating=parseInt(document.getElementById("meRating").value)||0;m.tags=parseTags(document.getElementById("meTags").value);m.review=document.getElementById("meReview").value.trim();LS.set("media",items);closeModal();renderMedia();toast("已更新")}


/* DECOR */
const DR=["客厅","卧室","厨房","卫生间","书房","阳台","儿童房","玄关","其他"];
function renderDecor(){const items=LS.get("decor",[]);const fl=S.dFilter==="all"?items:items.filter(d=>d.room===S.dFilter);let html=`<div class="ph"><div class="pt">装修灵感墙</div><button class="btn bp bs" onclick="dAdd()">+ 添加</button></div><div class="row mb12" style="flex-wrap:wrap;gap:6px"><button class="chip ${S.dFilter==="all"?"active":""}" onclick="dSF('all')">全部</button>${DR.map(r=>`<button class="chip ${S.dFilter===r?"active":""}" onclick="dSF('${r}')">${r}</button>`).join("")}</div>`;if(fl.length===0){html+=`<div class="card"><div class="empty">还没有灵感，添加一些装修灵感吧</div></div>`}else{html+=`<div class="decor-g">`;fl.forEach(d=>{html+=`<div class="dc" onclick="dDetail('${d.id}')"><div class="dc-img">${d.images&&d.images.length>0?`<img src="${d.images[0]}">`:"🏠"}</div><div class="dc-inf"><div class="t">${eh(d.title)}</div><div class="m">${d.room} ${d.style?"· "+eh(d.style):""}</div>${d.note?`<div class="n">${eh(d.note)}</div>`:""}</div></div>`});html+="</div>"}document.getElementById("page-decor").innerHTML=html}
function dSF(f){S.dFilter=f;renderDecor()}
function dAdd(){openModal(`<div class="mtitle">添加灵感</div><div class="ig"><label>标题</label><input type="text" id="dTitle" placeholder="如：客厅落地灯方案"></div><div class="g2"><div class="ig"><label>空间</label><select id="dRoom">${DR.map(r=>`<option value="${r}">${r}</option>`).join("")}</select></div><div class="ig"><label>风格</label><input type="text" id="dStyle" placeholder="如：日式、北欧"></div></div><div class="ig"><label>笔记</label><textarea id="dNote" placeholder="灵感描述、材料、尺寸..." style="min-height:60px"></textarea></div><div class="ig"><label>参考链接</label><input type="text" id="dLink" placeholder="可选 URL"></div><div class="ig"><label>图片</label><div class="row"><button class="btn bo bs" onclick="dPickImg()">+ 添加图片</button><span class="f12 t3" id="dImgCount">0张</span></div><div id="dImgs" class="row mt8" style="flex-wrap:wrap;gap:4px"></div></div><div class="row mt12" style="gap:12px"><button class="btn bo gw" onclick="closeModal()">取消</button><button class="btn bp gw" onclick="dSave()">添加</button></div>`);S.ed.dImgs=[]}
function dPickImg(){pickImg(img=>{S.ed.dImgs.push(img);const box=document.getElementById("dImgs");document.getElementById("dImgCount").textContent=S.ed.dImgs.length+"张";box.innerHTML=S.ed.dImgs.map((img,i)=>`<div class="it"><img src="${img}"><button class="del" onclick="dRmImg(${i})">×</button></div>`).join("")})}
function dRmImg(i){S.ed.dImgs.splice(i,1);document.getElementById("dImgs").innerHTML=S.ed.dImgs.map((img,i)=>`<div class="it"><img src="${img}"><button class="del" onclick="dRmImg(${i})">×</button></div>`).join("");document.getElementById("dImgCount").textContent=S.ed.dImgs.length+"张"}
function dSave(){const title=document.getElementById("dTitle").value.trim();if(!title){toast("请输入标题");return}const items=LS.get("decor",[]);items.push({id:uid(),title,room:document.getElementById("dRoom").value,style:document.getElementById("dStyle").value.trim(),note:document.getElementById("dNote").value.trim(),link:document.getElementById("dLink").value.trim(),images:[...(S.ed.dImgs||[])],date:today(),createdAt:Date.now()});LS.set("decor",items);closeModal();renderDecor();toast("已添加");checkBB()}
function dDetail(id){const d=LS.get("decor",[]).find(x=>x.id===id);if(!d)return;openModal(`<div class="mtitle">${eh(d.title)}</div>${d.images&&d.images.length?d.images.map(img=>`<img src="${img}" style="width:100%;border-radius:8px;margin-bottom:8px">`).join(""):""}<div class="col mb12" style="gap:4px"><div class="f13 t2">${d.room} ${d.style?"· "+eh(d.style):""}</div>${d.link?`<a href="${eh(d.link)}" target="_blank" class="f12" style="color:var(--blue)">${eh(d.link)}</a>`:""}</div>${d.note?`<div class="cs mb8"><div class="f13" style="line-height:1.6;white-space:pre-wrap">${eh(d.note)}</div></div>`:""}<div class="row" style="gap:12px"><button class="btn bo gw" onclick="dDel('${d.id}')">删除</button><button class="btn bp gw" onclick="closeModal()">关闭</button></div>`)}
function dDel(id){if(!confirm("删除这条灵感？"))return;let items=LS.get("decor",[]);items=items.filter(x=>x.id!==id);LS.set("decor",items);closeModal();renderDecor();toast("已删除")}

/* SETTINGS */
function renderSettings(){const n=totalRecords();const keys=["journal","finance","habits","habit_logs","fitness","todos","shopping","media","decor","budget","fgoal","wplan","cdef"];let sizes={};keys.forEach(k=>{const raw=LS.raw(k);sizes[k]=raw?raw.length:0});const totalSize=Object.values(sizes).reduce((s,v)=>s+v,0);const isDemo=LS.get("is_demo",false);let html=`<div class="ph"><div class="pt">设置与备份</div></div><div class="card mb16"><div class="row" style="justify-content:space-between"><span class="f14 fw6">数据总览</span><span class="f12 t2">${n} 条记录</span></div><div class="div"></div><div class="f12 t2" style="line-height:1.8">${keys.map(k=>{const d=LS.get(k,[]);const cnt=Array.isArray(d)?d.length:(typeof d==="object"?1:0);return cnt>0?`${k}: ${cnt}条 (${(sizes[k]/1024).toFixed(1)}KB)`:""}).filter(Boolean).join("<br>")}</div><div class="div"></div><div class="row" style="justify-content:space-between"><span class="f12 t2">总占用</span><span class="f13 fw6">${(totalSize/1024).toFixed(1)} KB</span></div></div><div class="card mb16"><h3 class="f14 fw7 mb8">数据备份</h3><p class="f12 t2 mb12">数据存储在浏览器本地（本地缓存 + IndexedDB 镜像双层），容量大、优先保留；但清除浏览器数据仍会导致丢失，建议每 7 天导出一次备份（已内置提醒）。</p><div class="col" style="gap:8px"><button class="btn bp" onclick="exportAll()">导出JSON备份</button><button class="btn bo" onclick="importAll()">导入JSON恢复</button><button class="btn bo" onclick="fCSV()">导出记账CSV</button><button class="btn bo" onclick="importRiji()">从日迹导入日记</button></div></div><div class="card mb16"><h3 class="f14 fw7 mb8">演示数据</h3>${isDemo?`<p class="f12 t2 mb12">当前数据为演示数据，可一键清空后开始正式使用。</p><button class="btn bo" style="color:var(--accent)" onclick="clearDemo()">清空演示数据</button>`:`<p class="f12 t2 mb12">加载少量演示数据，快速体验所有功能。</p><button class="btn bo" onclick="loadDemo()">加载演示数据</button>`}</div><div class="card mb16"><h3 class="f14 fw7 mb8">数据管理</h3><div class="col" style="gap:8px"><button class="btn bo" onclick="dismissBB()">关闭备份提醒</button><button class="btn bo" style="color:var(--accent)" onclick="clearAll()">清空所有数据</button></div></div><div class="card"><h3 class="f14 fw7 mb8">关于</h3><div class="f12 t2" style="line-height:1.8">生活工作台 v1.0<br>单文件HTML · 全离线 · localStorage存储<br>所有数据保存在本地浏览器中<br>${isDemo?"当前：演示数据":"当前：正式数据"}</div></div>`;document.getElementById("page-settings").innerHTML=html}
function exportAll(){const data={};["journal","finance","habits","habit_logs","fitness","todos","shopping","media","decor","budget","fgoal","wplan","cdef"].forEach(k=>{data[k]=LS.get(k,null)});data._meta={version:"1.0",exportedAt:new Date().toISOString()};const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`生活工作台备份_${today()}.json`;a.click();LS.set("lastBackup",Date.now());LS.set("bb_cancel_cnt",0);LS.set("bb_first_remind",0);document.getElementById("bk")&&document.getElementById("bk").classList.remove("show");toast("已导出备份")}
function importAll(){const inp=document.getElementById("fj");inp.onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const text=await f.text();const data=JSON.parse(text);if(!data||typeof data!=="object")throw new Error("格式错误");let cnt=0;["journal","finance","habits","habit_logs","fitness","todos","shopping","media","decor","budget","fgoal","wplan","cdef"].forEach(k=>{if(data[k]!==undefined&&data[k]!==null){LS.set(k,data[k]);if(Array.isArray(data[k]))cnt+=data[k].length}});toast(`导入成功，共${cnt}条`);renderSettings();checkBB()}catch(err){toast("导入失败："+err.message);openModal(`<div class="mtitle">导入失败</div><p class="f13 t2 mb12">文件可能已损坏或格式不正确。</p><p class="f12 t2">错误信息：${eh(err.message)}</p><div class="row mt12"><button class="btn bp gw" onclick="closeModal()">知道了</button></div>`)}e.target.value=""};inp.click()}
function loadDemo(){const td=today();const yd=fd(new Date(Date.now()-86400000));LS.set("journal",[{id:uid(),date:td,content:"今天试了新的咖啡店，拿铁很不错",mood:"😄",color:"#FFB347",images:[],createdAt:Date.now()},{id:uid(),date:yd,content:"读完了一本书，很有启发",mood:"💪",color:"#4ECDC4",images:[],createdAt:Date.now()-3600000}]);LS.set("finance",[{id:uid(),type:"expense",amount:35,category:"food",date:td,note:"午餐",createdAt:Date.now()},{id:uid(),type:"expense",amount:120,category:"transport",date:td,note:"打车",createdAt:Date.now()-3600000},{id:uid(),type:"income",amount:8000,category:"salary",date:td,note:"月薪",createdAt:Date.now()-7200000},{id:uid(),type:"expense",amount:299,category:"shop",date:yd,note:"买书",createdAt:Date.now()-86400000}]);LS.set("habits",[{id:"h1",name:"喝水8杯",type:"count",icon:"💧",target:8,unit:"杯",createdAt:Date.now()},{id:"h2",name:"跑步",type:"check",icon:"🏃",target:null,unit:"",createdAt:Date.now()},{id:"h3",name:"体重",type:"value",icon:"⚖️",target:65,unit:"kg",createdAt:Date.now()}]);LS.set("habit_logs",[{id:uid(),habitId:"h1",date:td,done:true,value:5,createdAt:Date.now()},{id:uid(),habitId:"h2",date:td,done:true,value:1,createdAt:Date.now()},{id:uid(),habitId:"h1",date:yd,done:true,value:8,createdAt:Date.now()},{id:uid(),habitId:"h2",date:yd,done:false,value:0,createdAt:Date.now()}]);LS.set("fitness",[{id:uid(),date:td,weight:66.5,bodyFat:19.5,note:"",createdAt:Date.now()},{id:uid(),date:fd(new Date(Date.now()-86400000*3)),weight:67.2,bodyFat:20.1,note:"",createdAt:Date.now()-86400000*3},{id:uid(),date:fd(new Date(Date.now()-86400000*7)),weight:68,bodyFat:20.5,note:"",createdAt:Date.now()-86400000*7}]);LS.set("fgoal",{height:170,tw:65,tbf:18});LS.set("todos",[{id:uid(),title:"取快递",date:td,remindTime:"18:00",priority:"p0",note:"",done:false,createdAt:Date.now()},{id:uid(),title:"给妈妈打电话",date:td,remindTime:"",priority:"p1",note:"",done:false,createdAt:Date.now()-3600000},{id:uid(),title:"逾期未完成的任务",date:fd(new Date(Date.now()-86400000*2)),remindTime:"",priority:"p1",note:"演示逾期",done:false,createdAt:Date.now()-86400000*2}]);LS.set("shopping",[{id:uid(),name:"牛奶",price:15,store:"超市",priority:"high",note:"",bought:false,date:td,createdAt:Date.now()},{id:uid(),name:"纸巾",price:30,store:"京东",priority:"mid",note:"",bought:false,date:td,createdAt:Date.now()},{id:uid(),name:"洗衣液",price:45,store:"",priority:"low",note:"",bought:true,date:yd,createdAt:Date.now()-86400000}]);LS.set("media",[{id:uid(),type:"book",title:"原则",author:"瑞·达利欧",status:"done",rating:4,review:"很受启发的一本书",cover:null,date:td,createdAt:Date.now()},{id:uid(),type:"movie",title:"奥本海默",author:"诺兰",status:"done",rating:5,review:"震撼",cover:null,date:td,createdAt:Date.now()},{id:uid(),type:"tv",title:"繁花",author:"王家卫",status:"doing",rating:0,review:"",cover:null,date:td,createdAt:Date.now()},{id:uid(),type:"book",title:"被讨厌的勇气",author:"岸见一郎",status:"want",rating:0,review:"",cover:null,date:td,createdAt:Date.now()}]);LS.set("decor",[{id:uid(),title:"客厅落地灯方案",room:"客厅",style:"日式",note:"暖光3000K，高度1.6米",link:"",images:[],date:td,createdAt:Date.now()},{id:uid(),title:"卧室床头柜",room:"卧室",style:"北欧",note:"白色简约款，宽度40cm",link:"",images:[],date:td,createdAt:Date.now()}]);LS.set("budget",{total:5000});LS.set("wplan",{"一":"跑步","二":"力量","三":"休息","四":"跑步","五":"瑜伽","六":"游泳","日":"休息"});LS.set("cdef",[{id:uid(),date:td,intake:1800,burn:500,createdAt:Date.now()}]);LS.set("is_demo",true);LS.set("bb_dismissed",false);renderSettings();toast("演示数据已加载");checkBB()}
function clearDemo(){if(!confirm("确定清空所有演示数据？此操作不可恢复。"))return;["journal","finance","habits","habit_logs","fitness","todos","shopping","media","decor","budget","fgoal","wplan","cdef","is_demo","bb_dismissed","bb_snoozed","bb_cancel_cnt","bb_first_remind","bk_dismissed","lastBackup"].forEach(k=>LS.del(k));renderSettings();toast("已清空演示数据");checkBB()}
function clearAll(){if(!confirm("警告：这将清空所有数据且不可恢复！\n\n建议先导出备份。\n\n确定继续？"))return;if(!confirm("再次确认：真的要清空所有数据吗？"))return;["journal","finance","habits","habit_logs","fitness","todos","shopping","media","decor","budget","fgoal","wplan","cdef","is_demo","bb_dismissed","bb_snoozed","bb_cancel_cnt","bb_first_remind","bk_dismissed","lastBackup"].forEach(k=>LS.del(k));renderSettings();toast("已清空所有数据");checkBB()}
function dismissBB(){LS.set("bb_dismissed",true);document.getElementById("bb").classList.remove("show");toast("已关闭备份提醒")}
function bbSnooze(){const now=Date.now();LS.set("bb_snoozed",now);LS.set("bb_cancel_cnt",(LS.get("bb_cancel_cnt",0)||0)+1);if(!LS.get("bb_first_remind",0))LS.set("bb_first_remind",now);document.getElementById("bb").classList.remove("show");toast("本次提醒已取消，7天后再提醒")}
function bkCheck(){const lb=LS.get("lastBackup",0);const dis=LS.get("bk_dismissed",0);const el=document.getElementById("bk");if(!el)return;const now=Date.now();if(lb&&(now-lb)/86400000>7&&(now-dis)/86400000>7)el.classList.add("show");else el.classList.remove("show")}
function bkDismiss(){LS.set("bk_dismissed",Date.now());document.getElementById("bk").classList.remove("show")}

/* INIT */
initNav();
if(!LS.get("initialized",false)){loadDemo();LS.set("initialized",true)}
renderHome();
idbRestore().then(()=>{renderHome();bkCheck()}).catch(()=>{bkCheck()});
</script>
